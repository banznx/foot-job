<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>取景台 · 帖子浏览</title>
<style>
/* ============================================================
   取景台 Design Tokens
   ============================================================ */
:root {
  /* 画布与表面 */
  --canvas: #FBFAF8;
  --surface: #FFFFFF;
  --surface-2: #F4F2EE;
  --surface-3: #ECEAE4;
  --scrim: rgba(26, 25, 23, 0.72);

  /* 墨色阶 */
  --ink-1: #1A1917;
  --ink-2: #57534E;
  --ink-3: #8A857D;
  --ink-4: #B4AFA6;

  /* 描边 */
  --line-1: rgba(26, 25, 23, 0.10);
  --line-2: rgba(26, 25, 23, 0.18);
  --line-3: rgba(26, 25, 23, 0.32);

  /* 强调 */
  --accent: #9A3B2E;
  --accent-hover: #8A3626;
  --accent-soft: #F6E7E3;
  --accent-ink: #8A3626;
  --teal: #2F6F62;
  --teal-soft: #E4F0EC;

  /* 字体 */
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
  --font-num: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;

  /* 间距 4px 基准 */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px; --s12: 48px;

  /* 圆角 */
  --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-xl: 16px; --r-full: 999px;

  /* 阴影：克制，只用于浮层 */
  --sh-1: 0 1px 2px rgba(26,25,23,0.05);
  --sh-2: 0 4px 16px rgba(26,25,23,0.08);
  --sh-3: 0 16px 48px rgba(26,25,23,0.16);

  /* 动效 */
  --t-fast: 140ms cubic-bezier(0.4, 0, 0.2, 1);
  --t-mid: 240ms cubic-bezier(0.4, 0, 0.2, 1);

  /* 布局：侧栏用 clamp 随视口伸缩，避免超宽屏下比例失衡 */
  --rail-w: clamp(184px, 15vw, 280px);
  --panel-w: clamp(300px, 26vw, 440px);
  --topbar-h: 56px;
  --gap: var(--s5);
  --pad: var(--s5);
  --radius-viewer: var(--r-xl);
  --thumb-size: 72px;
  --title-size: 22px;
  --detail-size: 15px;
}

[data-theme="dark"] {
  --canvas: #131211;
  --surface: #1C1A19;
  --surface-2: #262322;
  --surface-3: #322F2D;
  --scrim: rgba(0, 0, 0, 0.78);

  --ink-1: #F5F3F0;
  --ink-2: #B8B2AA;
  --ink-3: #8A857D;
  --ink-4: #635E58;

  --line-1: rgba(245, 243, 240, 0.12);
  --line-2: rgba(245, 243, 240, 0.20);
  --line-3: rgba(245, 243, 240, 0.34);

  --accent: #C9705F;
  --accent-hover: #D67F6E;
  --accent-soft: #3A2420;
  --accent-ink: #E8A392;
  --teal: #6FB3A2;
  --teal-soft: #1E302C;

  --sh-1: 0 1px 2px rgba(0,0,0,0.4);
  --sh-2: 0 4px 16px rgba(0,0,0,0.5);
  --sh-3: 0 16px 48px rgba(0,0,0,0.6);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }

body {
  font-family: var(--font);
  background: var(--canvas);
  color: var(--ink-1);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

::selection { background: var(--accent-soft); color: var(--accent-ink); }

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* ============================================================
   骨架屏
   ============================================================ */
@keyframes shimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
.sk {
  background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%);
  background-size: 800px 100%;
  animation: shimmer 1.4s linear infinite;
  border-radius: var(--r-sm);
}

/* ============================================================
   多端基础重置：viewport-fit 配合 env(safe-area-inset-*) 适配刘海屏与手势条
   ============================================================ */
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  /* 禁掉 iOS 双击缩放与长按选中，图片浏览页不需要这些浏览器默认行为 */
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
/* 图片与按钮区域不参与长按选中文本 */
img, button, .rail-item, .chip, .action, .thumb, .meta-val, .stat-num {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

/* ============================================================
   布局骨架
   ============================================================ */
.app {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--panel-w);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas:
    "brand topbar topbar"
    "rail  stage panel";
  height: 100vh;
  height: 100dvh;
  /* 刘海屏 / 圆角屏：viewport-fit=cover 后内容会延伸到安全区外，需手动避让 */
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}

/* --- 品牌区 --- */
.brand {
  grid-area: brand;
  display: flex; align-items: center;
  gap: var(--s3);
  padding: 0 var(--s5);
  border-right: 1px solid var(--line-1);
  border-bottom: 1px solid var(--line-1);
  background: var(--surface);
  /* 与顶栏等高（含刘海安全区），否则两栏底部边框错位 */
  min-height: calc(var(--topbar-h) + env(safe-area-inset-top));
}
.brand-mark {
  width: 26px; height: 26px; border-radius: 7px;
  background: var(--accent);
  display: grid; place-items: center;
  flex-shrink: 0;
}
.brand-name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.brand-sub { font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; }

/* --- 顶栏 --- */
.topbar {
  grid-area: topbar;
  display: flex; align-items: center; gap: var(--s3);
  padding: 0 var(--s5);
  padding-top: env(safe-area-inset-top);
  height: calc(var(--topbar-h) + env(safe-area-inset-top));
  border-bottom: 1px solid var(--line-1);
  background: var(--surface);
}
.topbar-title {
  font-size: 13px; color: var(--ink-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topbar-spacer { flex: 1; }

.icon-btn {
  width: 34px; height: 34px;
  border-radius: var(--r-md);
  display: grid; place-items: center;
  color: var(--ink-2);
  transition: background var(--t-fast), color var(--t-fast);
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink-1); }
.icon-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); }

.kbd-hint {
  font-family: var(--font-num);
  font-size: 11px; color: var(--ink-3);
  background: var(--surface-2);
  border: 1px solid var(--line-1);
  border-radius: var(--r-sm);
  padding: 3px 6px;
  white-space: nowrap;
}

/* --- 左栏 --- */
.rail {
  grid-area: rail;
  background: var(--surface);
  border-right: 1px solid var(--line-1);
  padding: var(--s5) var(--s3);
  display: flex; flex-direction: column; gap: var(--s6);
  overflow-y: auto;
}
.rail-group { display: flex; flex-direction: column; gap: 2px; }
.rail-label {
  font-size: 11px; font-weight: 600; color: var(--ink-3);
  letter-spacing: 0.06em;
  padding: 0 var(--s3) var(--s2);
}
.rail-item {
  display: flex; align-items: center; gap: var(--s3);
  width: 100%;
  padding: 9px var(--s3);
  border-radius: var(--r-md);
  font-size: 14px; color: var(--ink-2);
  text-align: left;
  transition: background var(--t-fast), color var(--t-fast);
}
.rail-item:hover { background: var(--surface-2); color: var(--ink-1); }
.rail-item[aria-current="true"] {
  background: var(--accent-soft); color: var(--accent-ink); font-weight: 500;
}
.rail-item svg { flex-shrink: 0; opacity: 0.85; }
.rail-count {
  margin-left: auto;
  font-family: var(--font-num);
  font-size: 11px; color: var(--ink-3);
}
.rail-item[aria-current="true"] .rail-count { color: var(--accent-ink); }

.rail-sep { height: 1px; background: var(--line-1); margin: 0 var(--s3); }

/* 筛选 */
.filter-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--s2); padding: 6px var(--s3);
}
.filter-row label { font-size: 13px; color: var(--ink-2); }
.filter-row select {
  background: var(--surface-2);
  border: 1px solid var(--line-1);
  border-radius: var(--r-sm);
  padding: 4px 8px;
  font-size: 12px;
  color: var(--ink-1);
  cursor: pointer;
}

.rail-foot {
  margin-top: auto;
  padding: var(--s3);
  font-size: 11px; color: var(--ink-4);
  line-height: 1.6;
  border-top: 1px solid var(--line-1);
}

/* ============================================================
   舞台
   ============================================================ */
.stage {
  grid-area: stage;
  position: relative;
  display: flex; flex-direction: column;
  background: var(--canvas);
  min-width: 0; min-height: 0;
}

.stage-head {
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s3) var(--gap);
  min-height: 48px;
}
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 500;
  padding: 4px 9px; border-radius: var(--r-sm);
  background: var(--surface-2); color: var(--ink-2);
  white-space: nowrap;
}
.chip--accent { background: var(--accent-soft); color: var(--accent-ink); }
.chip--teal { background: var(--teal-soft); color: var(--teal); }
.stage-head-spacer { flex: 1; }

.viewer {
  position: relative;
  flex: 1;
  min-height: 0;
  margin: 0 var(--gap);
  border-radius: var(--radius-viewer);
  overflow: hidden;
  background: var(--surface-3);
  display: grid; place-items: center;
  padding: 2px;
}
.viewer-img {
  max-width: 100%; max-height: 100%;
  width: auto; height: auto;
  object-fit: contain;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
  transition: opacity var(--t-mid);
}
.viewer[data-fit="cover"] .viewer-img {
  width: 100%; height: 100%;
  object-fit: cover;
}

.viewer-empty {
  display: flex; flex-direction: column; align-items: center; gap: var(--s3);
  color: var(--ink-3); font-size: 14px;
}
/* display:flex 的特异性高于 [hidden] 的 UA 样式，必须显式兜住，
   否则空状态层会一直盖在已加载完成的图片上 */
.viewer-empty[hidden] { display: none; }

.viewer-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px;
  border-radius: var(--r-full);
  background: rgba(255,255,255,0.92);
  color: #1A1917;
  display: grid; place-items: center;
  box-shadow: var(--sh-2);
  transition: transform var(--t-fast), background var(--t-fast), opacity var(--t-fast);
  opacity: 0;
}
.viewer:hover .viewer-nav, .viewer-nav:focus-visible { opacity: 1; }
.viewer-nav:hover { transform: translateY(-50%) scale(1.08); background: #fff; }
.viewer-nav--prev { left: var(--s3); }
.viewer-nav--next { right: var(--s3); }
[data-theme="dark"] .viewer-nav { background: rgba(38,35,34,0.92); color: #F5F3F0; }
[data-theme="dark"] .viewer-nav:hover { background: #322F2D; }

.viewer-zoom {
  position: absolute; right: var(--s3); bottom: var(--s3);
  display: flex; gap: var(--s2);
}
.ghost-btn {
  height: 32px; padding: 0 10px;
  border-radius: var(--r-md);
  background: rgba(255,255,255,0.9);
  color: #1A1917;
  font-size: 12px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 5px;
  box-shadow: var(--sh-1);
  transition: background var(--t-fast);
}
.ghost-btn:hover { background: #fff; }
[data-theme="dark"] .ghost-btn { background: rgba(38,35,34,0.9); color: #F5F3F0; }
[data-theme="dark"] .ghost-btn:hover { background: #322F2D; }

/* 胶片条 */
.filmstrip {
  display: flex; gap: var(--s2);
  padding: var(--s4) var(--gap);
  overflow-x: auto;
  scrollbar-width: thin;
}
.filmstrip::-webkit-scrollbar { height: 4px; }
.filmstrip::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 2px; }
.thumb {
  position: relative;
  flex: 0 0 auto;
  width: var(--thumb-size); height: var(--thumb-size);
  border-radius: var(--r-md);
  overflow: hidden;
  background: var(--surface-3);
  border: 2px solid transparent;
  transition: border-color var(--t-fast), transform var(--t-fast), opacity var(--t-fast);
  opacity: 0.5;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb:hover { opacity: 0.85; transform: translateY(-2px); }
.thumb[aria-current="true"] {
  border-color: var(--accent);
  opacity: 1;
}
.thumb-num {
  position: absolute; left: 4px; top: 4px;
  font-family: var(--font-num); font-size: 10px;
  background: rgba(26,25,23,0.7); color: #fff;
  padding: 1px 4px; border-radius: 3px;
}

/* 进度分栏指示器 */
.progress {
  display: flex; gap: 4px;
  height: 3px;
  margin: 0 var(--gap) var(--s4);
}
.progress-seg {
  flex: 1; border-radius: 2px;
  background: var(--surface-3);
  transition: background var(--t-mid);
}
.progress-seg[data-on="true"] { background: var(--accent); }

.stage-foot {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--s4);
  padding: 0 var(--gap) var(--pad);
}
.pager { display: flex; align-items: center; gap: var(--s2); }
.foot-actions { display: flex; gap: var(--s2); align-items: center; }
.pager-btn {
  height: 36px; padding: 0 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--line-2);
  font-size: 13px; font-weight: 500;
  color: var(--ink-1);
  display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap; flex-shrink: 0;
  transition: background var(--t-fast), border-color var(--t-fast);
}
.pager-btn:hover:not(:disabled) { background: var(--surface-2); }
.pager-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-primary {
  height: 40px; padding: 0 20px;
  border-radius: var(--r-md);
  background: var(--accent); color: #fff;
  font-size: 14px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 8px;
  white-space: nowrap; flex-shrink: 0;
  transition: background var(--t-fast), transform var(--t-fast);
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:active { transform: scale(0.98); }
[data-theme="dark"] .btn-primary { color: #1A1917; }

.btn-secondary {
  height: 40px; padding: 0 16px;
  border-radius: var(--r-md);
  border: 1px solid var(--line-2);
  font-size: 14px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 8px;
  color: var(--ink-1);
  white-space: nowrap; flex-shrink: 0;
  transition: background var(--t-fast);
}
.btn-secondary:hover { background: var(--surface-2); }
.btn-secondary[aria-pressed="true"] {
  background: var(--accent-soft); color: var(--accent-ink); border-color: transparent;
}

/* ============================================================
   右侧信息面板
   ============================================================ */
.panel {
  grid-area: panel;
  background: var(--surface);
  border-left: 1px solid var(--line-1);
  overflow-y: auto;
  display: flex; flex-direction: column;
}
.panel-inner { padding: var(--s6) var(--gap) var(--s8); }

.panel-eyebrow {
  display: flex; align-items: center; gap: var(--s2);
  font-size: 11px; color: var(--ink-3);
  letter-spacing: 0.04em;
  margin-bottom: var(--s3);
}
.panel-title {
  font-size: var(--title-size); font-weight: 600;
  line-height: 1.35; letter-spacing: -0.01em;
  margin-bottom: var(--s3);
  overflow-wrap: anywhere;
}
.panel-detail {
  font-size: var(--detail-size); line-height: 1.7;
  color: var(--ink-2);
  margin-bottom: var(--s5);
  overflow-wrap: anywhere;
}
.panel-detail.clamped {
  display: -webkit-box; -webkit-line-clamp: 5;
  -webkit-box-orient: vertical; overflow: hidden;
}
.link-more {
  font-size: 13px; color: var(--accent-ink);
  font-weight: 500; margin-top: -8px; margin-bottom: var(--s4);
}

.divider { height: 1px; background: var(--line-1); margin: var(--s5) 0; }

/* 作者 */
.author { display: flex; align-items: center; gap: var(--s3); }
.avatar {
  width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center;
  color: #fff; font-size: 16px; font-weight: 500;
  flex-shrink: 0; overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.author-meta { min-width: 0; flex: 1; }
.author-name {
  font-size: 14px; font-weight: 500;
  display: flex; align-items: center; gap: 6px;
}
.author-badge {
  font-size: 10px; font-weight: 500;
  padding: 2px 6px; border-radius: 4px;
  background: var(--accent-soft); color: var(--accent-ink);
}
.author-sub { font-size: 12px; color: var(--ink-3); margin-top: 1px; }

/* 统计 */
.stats { display: flex; gap: var(--s8); }
.stat-num {
  font-family: var(--font-num);
  font-size: 17px; font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.stat-label { font-size: 11px; color: var(--ink-3); margin-top: 1px; }
.stat--accent .stat-num { color: var(--accent); }

/* 动作栏 */
.actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--s2);
  margin-top: var(--s5);
}
.action {
  height: 44px;
  border-radius: var(--r-md);
  border: 1px solid var(--line-1);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  font-size: 11px; color: var(--ink-2);
  transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
}
.action:hover { background: var(--surface-2); color: var(--ink-1); }
.action[aria-pressed="true"] {
  background: var(--accent-soft); color: var(--accent-ink);
  border-color: transparent;
}
.action[aria-pressed="true"] svg { fill: currentColor; }

/* 元信息 */
.meta-list { display: flex; flex-direction: column; gap: var(--s3); }
.meta-row {
  display: flex; align-items: baseline; gap: var(--s3);
  font-size: 13px;
}
.meta-key { color: var(--ink-3); width: 68px; flex-shrink: 0; }
.meta-val { color: var(--ink-2); font-family: var(--font-num); font-size: 12px; }

/* 空状态 */
.empty {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: var(--s3);
  padding: var(--s12) var(--s5);
  text-align: center;
  color: var(--ink-3);
  flex: 1;
}
.empty-title { font-size: 15px; font-weight: 500; color: var(--ink-2); }
.empty-text { font-size: 13px; max-width: 240px; line-height: 1.7; }

/* ============================================================
   灯箱
   ============================================================ */
.lightbox {
  position: fixed; inset: 0;
  background: var(--scrim);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  z-index: 100;
  display: grid;
  grid-template-rows: auto minmax(0,1fr) auto;
  /* 灯箱是全屏浮层，横屏刘海与手势条同样要避让 */
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  animation: fadeIn var(--t-mid);
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
.lightbox[hidden] { display: none; }
.lb-bar {
  display: flex; align-items: center; gap: var(--s3);
  padding: 0 var(--s5);
  color: #F5F3F0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.45), transparent);
}
.lb-title {
  font-size: 13px; opacity: 0.8;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.lb-close {
  margin-left: auto;
  width: 34px; height: 34px; border-radius: var(--r-md);
  display: grid; place-items: center;
  color: #F5F3F0;
  transition: background var(--t-fast);
}
.lb-close:hover { background: rgba(255,255,255,0.14); }
.lb-stage {
  position: relative;
  display: grid; place-items: center;
  padding: 0 var(--s5);
  min-height: 0;
}
.lb-stage img {
  max-width: 100%; max-height: 100%;
  object-fit: contain;
  display: block;
  user-select: none;
}
.lb-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,0.14); color: #fff;
  display: grid; place-items: center;
  transition: background var(--t-fast);
}
.lb-nav:hover { background: rgba(255,255,255,0.26); }
.lb-nav--prev { left: var(--s4); }
.lb-nav--next { right: var(--s4); }
.lb-foot {
  display: flex; align-items: center; justify-content: center;
  gap: var(--s2);
  padding: var(--s5);
  min-height: 108px;
  background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
}
.lb-count {
  font-family: var(--font-num); font-size: 12px;
  color: rgba(255,255,255,0.75);
  padding: 0 var(--s3);
}

/* 提示条 */
.toast-wrap {
  position: fixed; bottom: var(--s6); left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  display: flex; flex-direction: column; gap: var(--s2);
  align-items: center;
  pointer-events: none;
  max-width: calc(100vw - 2 * var(--s5));
}
.toast {
  background: var(--ink-1); color: var(--canvas);
  font-size: 13px; font-weight: 500;
  padding: 10px 18px;
  border-radius: var(--r-full);
  box-shadow: var(--sh-3);
  animation: toastIn var(--t-mid);
}
[data-theme="dark"] .toast { background: #322F2D; color: #F5F3F0; border: 1px solid var(--line-2); }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(12px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* 快捷键面板 */
.shortcuts {
  position: fixed; inset: 0; z-index: 150;
  background: var(--scrim);
  display: grid; place-items: center;
  padding: var(--s5);
  animation: fadeIn var(--t-fast);
}
.shortcuts[hidden] { display: none; }
.shortcuts-card {
  background: var(--surface);
  border-radius: var(--r-xl);
  box-shadow: var(--sh-3);
  padding: var(--s6);
  width: 100%; max-width: 380px;
  max-height: 80vh; overflow-y: auto;
}
.shortcuts h2 { font-size: 16px; font-weight: 600; margin-bottom: var(--s4); }
.shortcut-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--s4);
  padding: var(--s2) 0;
  font-size: 13px; color: var(--ink-2);
  border-bottom: 1px solid var(--line-1);
}
.shortcut-row:last-child { border-bottom: none; }
.shortcut-keys { display: flex; gap: 4px; }
kbd {
  font-family: var(--font-num); font-size: 11px;
  background: var(--surface-2);
  border: 1px solid var(--line-2);
  border-bottom-width: 2px;
  border-radius: var(--r-sm);
  padding: 3px 7px;
  color: var(--ink-1);
  min-width: 24px; text-align: center;
}

/* ============================================================
   [hidden] 全局兜底
   组件类里的 display:flex/grid 特异性 (0,1,0) 高于浏览器 UA 的
   [hidden]{display:none}，导致 hidden=true 时元素依然可见。
   这里用属性选择器统一兜住，比逐个组件加规则更可靠。
   ============================================================ */
[hidden] { display: none !important; }

/* 移动端底部操作栏 */
.mobile-bar { display: none; }

/* ============================================================
   多端适配

   断点体系（按设备形态而非纯数值划分）：

     xs   < 360px      小屏手机（iPhone SE 一代 / 老安卓）
     sm   360–599px    手机竖屏
     md   600–979px    大屏手机横屏 / 平板竖屏
     lg   980–1279px   平板横屏 / 小笔记本
     xl   1280–1919px  常规桌面
     2xl  ≥ 1920px     大屏与超宽屏
     fold 折叠屏展开态（横向空间足够但需压缩信息密度）

   移动优先的反向做法：从宽到窄逐级收窄，避免移动端被桌面规则牵连。
   ============================================================ */

/* ---- 2xl 大屏 / 超宽屏 ---- */
@media (min-width: 1920px) {
  :root {
    --topbar-h: 64px;
    --gap: var(--s8);
    --pad: var(--s6);
    --thumb-size: 88px;
    --title-size: 26px;
    --detail-size: 16px;
    /* 超宽屏上限制舞台内容宽度，避免图片被拉伸到荒谬尺寸而两侧留白 */
    --stage-max: 1400px;
  }
  /* clamp 已封顶（rail 280 / panel 440），此处无需再覆盖 */
}

/* 舞台内容统一限宽并居中。stage 是 flex 容器，
   直接给子元素设 width:100% 会参照 stage 宽度而非限值，
   因此用一个内层容器承载宽度约束。 */
.stage-inner {
  width: 100%;
  max-width: var(--stage-max, none);
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
  flex: 1;
}

/* ---- xl 常规桌面 ---- */
@media (min-width: 1280px) and (max-width: 1919px) {
  :root { --gap: var(--s6); --pad: var(--s5); }
}

/* ---- lg 平板横屏 / 小笔记本 ---- */
@media (min-width: 980px) and (max-width: 1279px) {
  :root {
    --topbar-h: 54px;
    --gap: var(--s4);
    --pad: var(--s4);
    --thumb-size: 64px;
    --title-size: 20px;
    --detail-size: 15px;
  }
}

/* ---- md 及以下：解除高度锁，改为整页自然滚动 ---- */
@media (max-width: 979px) {
  :root {
    --topbar-h: 52px;
    --gap: var(--s4);
    --pad: var(--s4);
    --radius-viewer: var(--r-lg);
    --thumb-size: 64px;
    --title-size: 19px;
    /* 移动端正文不小于 16px，否则 iOS Safari 聚焦时会自动缩放页面 */
    --detail-size: 16px;
  }
  body { overflow: auto; }
  html, body { height: auto; }
  .app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto auto;
    grid-template-areas: "topbar" "stage" "panel";
    height: auto;
    min-height: 100dvh;
    overflow: visible;
  }
  .brand, .rail { display: none; }
  .topbar { position: sticky; top: 0; z-index: 20; }

  .stage { min-height: 0; }
  .viewer {
    flex: none;
    /* 用 svh 而非 vh：移动端浏览器地址栏收起时 vh 不会变，导致图片区被截断 */
    height: 56svh;
    min-height: 280px;
  }

  /* 换一篇/收藏交给底部固定栏，页脚只留前后篇导航 */
  .foot-actions { display: none; }
  .pager { width: 100%; }
  .pager-btn { flex: 1; justify-content: center; height: 40px; }

  .panel {
    border-left: none; border-top: 1px solid var(--line-1);
    overflow: visible;
  }
  .panel-inner { padding: var(--s5) var(--gap) 96px; }

  /* 触屏没有 hover，导航按钮必须常驻可见 */
  .viewer-nav { opacity: 1; }

  /* 底部有固定操作栏，提示条上移避免被遮挡 */
  .toast-wrap { bottom: calc(var(--s6) + 60px + env(safe-area-inset-bottom)); }

  .mobile-bar {
    display: flex; align-items: center; gap: var(--s2);
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: var(--s3) var(--s4);
    padding-bottom: calc(var(--s3) + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--line-1);
    z-index: 30;
  }
  .mobile-bar .btn-primary { flex: 1; justify-content: center; }
}

/* ---- md 区间内的平板竖屏：图片可以更高一些 ---- */
@media (min-width: 600px) and (max-width: 979px) {
  :root { --gap: var(--s5); --title-size: 21px; --thumb-size: 72px; }
  .viewer { height: 60svh; }
  .panel-inner {
    /* 平板竖屏下单栏过窄，用两列消化纵向长度。
       只让标题/正文/展开按钮跨满两列，其余卡片自然流入，
       避免出现「左列空一格、右列挤一格」的不均分布。 */
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    column-gap: var(--s6);
    align-content: start;
  }
  .panel-eyebrow, .panel-title, .panel-detail, .link-more { grid-column: 1 / -1; }
  /* 作者与统计跨满两列；动作栏与元信息真正并排成双列 */
  .author, .stats { grid-column: 1 / -1; }
  .actions, .meta-list { grid-column: auto; }
  /* 网格下分隔线会切断列间视觉，改为行间距承担分组 */
  .panel-inner .divider { display: none; }
  .panel-inner { row-gap: var(--s5); }
  /* 网格布局不接受外边距，统一交给 row-gap 控制 */
  .panel-inner .actions, .panel-inner .meta-list,
  .panel-inner .author, .panel-inner .stats { margin-top: 0; }
}

/* ---- sm 手机竖屏 ---- */
@media (max-width: 599px) {
  :root { --thumb-size: 64px; }
  .kbd-hint { display: none; }
  .topbar-title { font-size: 12px; }
  .viewer { height: 52svh; min-height: 260px; }
}

/* ---- xs 小屏手机 ---- */
@media (max-width: 359px) {
  :root {
    --gap: var(--s3);
    --pad: var(--s3);
    --topbar-h: 48px;
    --thumb-size: 56px;
    --title-size: 17px;
    --detail-size: 16px;
  }
  .brand-name, .topbar-title { font-size: 13px; }
  .viewer { height: 46svh; min-height: 220px; }
  .stats { gap: var(--s5); }
  .panel-inner { padding: var(--s4) var(--gap) 92px; }
  .pager-btn { padding: 0 8px; font-size: 12px; }
  .action { font-size: 10px; }
  .mobile-bar { padding-left: var(--s3); padding-right: var(--s3); }
  .meta-key { width: 56px; }
}

/* ---- 折叠屏展开态：横向空间足够，压缩信息密度换取图片面积 ---- */
@media (min-width: 673px) and (max-width: 1199px) and (min-height: 500px) {
  :root { --gap: var(--s4); }
}

/* ---- 横屏矮视口（手机横放）：纵向空间稀缺，压缩非必要高度 ---- */
@media (max-height: 520px) and (orientation: landscape) {
  :root { --topbar-h: 44px; }
  .stage-head { min-height: 40px; padding-block: var(--s2); }
  .viewer { height: calc(100svh - 210px); min-height: 180px; }
  .filmstrip { padding-block: var(--s2); }
  .stage-foot { padding-bottom: var(--s3); }
  .panel-title { font-size: 18px; }
}

/* ---- 触屏设备：放大触达目标，去掉仅 hover 可达的交互 ---- */
@media (hover: none) and (pointer: coarse) {
  .viewer-nav { opacity: 1; }
  .rail-item { padding-block: 12px; }
  .action { height: 52px; }
  .icon-btn { width: 40px; height: 40px; }
  /* 触屏上 :hover 会在点按后短暂残留，卡片类元素直接禁用 */
  .thumb:hover, .viewer-nav:hover, .pager-btn:hover, .rail-item:hover {
    transform: none;
  }
  .thumb:hover { opacity: 0.5; }
  .thumb[aria-current="true"] { opacity: 1; }
}

/* ---- 桌面触屏笔记本：有精确指针但触屏可用 ---- */
@media (hover: hover) and (pointer: fine) {
  .viewer-nav { opacity: 0; }
  .viewer:hover .viewer-nav,
  .viewer:focus-within .viewer-nav { opacity: 1; }
}

/* ---- 减少动态效果 ---- */
@media (prefers-reduced-motion: reduce) {
  .viewer-img, .toast, .lightbox, .shortcuts { transition: none !important; animation: none !important; }
  .sk { animation: none; }
}

/* ---- 高对比度偏好 ---- */
@media (prefers-contrast: more) {
  :root { --line-1: rgba(26,25,23,0.28); --line-2: rgba(26,25,23,0.45); }
  [data-theme="dark"] { --line-1: rgba(245,243,240,0.32); --line-2: rgba(245,243,240,0.5); }
}

/* ---- 打印：只保留内容，去掉界面 ---- */
@media print {
  .brand, .rail, .topbar, .mobile-bar, .filmstrip, .progress,
  .stage-foot, .viewer-nav, .viewer-zoom, .actions, .toast-wrap { display: none !important; }
  body { overflow: visible; background: #fff; }
  .app { display: block; height: auto; }
  .viewer { height: auto; border: none; }
  .viewer-img { max-height: 60vh; }
  .panel { border: none; overflow: visible; }
}

</style>
</head>
<body>

<div class="app">

  <!-- 品牌 -->
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">取景台</div>
      <div class="brand-sub">FRAME</div>
    </div>
  </div>

  <!-- 顶栏 -->
  <header class="topbar">
    <span class="topbar-title" id="topbarTitle">正在准备索引…</span>
    <div class="topbar-spacer"></div>
    <span class="kbd-hint">← → 切图</span>
    <span class="kbd-hint">N 换一篇</span>
    <span class="kbd-hint">F 收藏</span>
    <button class="icon-btn" id="shortcutsBtn" aria-label="查看快捷键" title="快捷键">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <rect x="2" y="6" width="20" height="13" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>
      </svg>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="切换深浅主题" title="切换主题">
      <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </header>

  <!-- 左栏 -->
  <nav class="rail" aria-label="浏览视图">
    <div class="rail-group">
      <div class="rail-label">浏览</div>
      <button class="rail-item" data-view="random" aria-current="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        <span>随机发现</span>
      </button>
      <button class="rail-item" data-view="hot">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2s5 4.5 5 9a5 5 0 0 1-10 0c0-1.6.7-3 1.5-4 0 1.5.8 2.5 1.8 2.5C12 9.5 11 5 12 2z"/></svg>
        <span>热门精选</span>
      </button>
      <button class="rail-item" data-view="fav">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span>我的收藏</span>
        <span class="rail-count" id="favCount">0</span>
      </button>
      <button class="rail-item" data-view="history">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>
        <span>浏览历史</span>
        <span class="rail-count" id="histCount">0</span>
      </button>
    </div>

    <div class="rail-sep"></div>

    <div class="rail-group">
      <div class="rail-label">筛选</div>
      <div class="filter-row">
        <label for="sortSel">排序</label>
        <select id="sortSel">
          <option value="random">随机</option>
          <option value="hot">浏览最多</option>
          <option value="praise">点赞最多</option>
          <option value="new">最新发布</option>
        </select>
      </div>
      <div class="filter-row">
        <label for="minImgSel">图片数</label>
        <select id="minImgSel">
          <option value="0">不限</option>
          <option value="2">≥ 2 张</option>
          <option value="4">≥ 4 张</option>
          <option value="6">≥ 6 张</option>
        </select>
      </div>
      <div class="filter-row">
        <label for="unseenChk">仅未看过</label>
        <input type="checkbox" id="unseenChk" style="accent-color: var(--accent); width:15px; height:15px; cursor:pointer;">
      </div>
    </div>

    <div class="rail-foot">
      <div id="statLine">—</div>
      <div style="margin-top:4px">数据为 AI 随机生成，仅供演示</div>
    </div>
  </nav>

  <!-- 舞台 -->
  <main class="stage">
    <div class="stage-inner">
    <div class="stage-head">
      <span class="chip chip--accent" id="imgCounter">0 / 0</span>
      <span class="chip" id="multiChip" hidden>多图</span>
      <div class="stage-head-spacer"></div>
      <span class="chip" id="fitChip" style="cursor:pointer" role="button" tabindex="0"
            aria-label="切换图片适应方式">完整显示</span>
    </div>

    <div class="viewer" id="viewer" data-fit="cover">
      <div class="viewer-empty" id="viewerEmpty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
        <span id="viewerEmptyText">加载中…</span>
      </div>
      <button class="viewer-nav viewer-nav--prev" id="prevBtn" aria-label="上一张" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="viewer-nav viewer-nav--next" id="nextBtn" aria-label="下一张" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <div class="viewer-zoom">
        <button class="ghost-btn" id="lightboxBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
          放大
        </button>
      </div>
    </div>

    <div class="progress" id="progress" role="tablist" aria-label="图片进度"></div>
    <div class="filmstrip" id="filmstrip" role="tablist" aria-label="图片缩略图"></div>

    <div class="stage-foot">
      <div class="pager">
        <button class="pager-btn" id="prevPostBtn" aria-label="上一篇">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          上一篇
        </button>
        <button class="pager-btn" id="nextPostBtn" aria-label="下一篇">
          下一篇
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <div class="foot-actions">
        <button class="btn-secondary" id="favBtn" aria-pressed="false">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>

<!-- 数据 bundle：2340 篇帖子打包在此，由 build_data.py 生成。
     放在主脚本之前，保证 window.__POSTS__ 就绪。
     用 <script> 而非 fetch，是为了绕开静态托管的跨域限制。 -->
<script src="posts-data.js"></script>

<script>
'use strict';

/* ============================================================
   常量与状态
   ============================================================ */

/* 数据来源：静态 bundle（由 build_data.py 生成）
   为什么不用 fetch 读 posts2/*.json —— 静态托管（GitHub Pages / jsDelivr）
   下跨域请求会被 CORS 拦截，页面只会显示「无法读取 index.json」。
   <script src> 不受同源策略限制，是纯静态部署唯一可靠的方式。 */
const DATA_FILE = 'posts-data.js';

/* 图片源：留空则用同源相对路径（本地起服务时有效）。
   部署到 GitHub Pages 时必须填 CDN 地址，否则图片 404。
   可选值：
     'https://cdn.jsdelivr.net/gh/banznx/foot-job@main/images/downloaded_posts_images/'
     'https://raw.githubusercontent.com/banznx/foot-job/main/images/downloaded_posts_images/'
   注意：仓库图片体积 1.2GB，已超出 GitHub 推荐的 1GB 上限，
   CDN 可能限流或拒绝对超大仓库提供文件服务，务必实测后再定。 */
const IMAGE_BASE = '';

/* 若线上 CDN 拉不到图，可在此填一个可用的图床前缀（需允许跨域） */
const IMAGE_FALLBACK_BASE = '';

const LS = {
  fav: 'fj_favs',
  hist: 'fj_history',
  liked: 'fj_liked',
  seen: 'fj_seen',
  theme: 'fj_theme',
  fit: 'fj_fit'
};

const state = {
  index: [],          // 全部帖子 id 列表
  cache: new Map(),   // postID -> post
  view: 'random',
  post: null,
  imgIdx: 0,
  fit: 'cover',
  seen: new Set(load(LS.seen, [])),
  favs: new Set(load(LS.fav, [])),
  liked: new Set(load(LS.liked, [])),
  history: load(LS.hist, []),
  cursor: -1,         // 当前在候选序列中的位置
  pool: [],           // 当前视图的候选序列
  favMeta: new Map(), // postID -> {title, nick} 供收藏/历史列表展示
  loading: false
};

function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

const $ = id => document.getElementById(id);

/* ============================================================
   工具
   ============================================================ */
function fmtNum(n) {
  n = Number(n) || 0;
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + 'w';
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
  return String(n);
}
function fmtDate(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  if (isNaN(d)) return '—';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
/* 图片地址：文件名规则为 {postID}_{原文件名} */
const LOCAL_IMAGES_DIR = 'images/downloaded_posts_images/';
function localImagePath(url, postID) {
  const name = String(url).split('/').pop().split('?')[0];
  const file = postID + '_' + name;
  if (IMAGE_BASE) return IMAGE_BASE + file;
  if (IMAGE_FALLBACK_BASE) return IMAGE_FALLBACK_BASE + file;
  return LOCAL_IMAGES_DIR + file;
}

/* 图片加载失败时尝试备用源，仍失败则交由调用方显示提示 */
function withImageFallback(img, url, postID) {
  let tried = false;
  img.addEventListener('error', function () {
    if (tried || !IMAGE_FALLBACK_BASE) return;
    tried = true;
    const file = String(url).split('/').pop().split('?')[0];
    img.src = IMAGE_FALLBACK_BASE + postID + '_' + file;
  });
}
function toast(msg) {
  const wrap = $('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .2s, transform .2s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    setTimeout(() => el.remove(), 220);
  }, 1700);
}
const AVATAR_COLORS = ['#9A3B2E','#2F6F62','#7A5C9E','#B5762F','#3E6FA8','#A03C6B','#5A7A2F','#8C5A3C'];
function avatarColor(id) {
  const n = Number(id) || 0;
  return AVATAR_COLORS[Math.abs(n) % AVATAR_COLORS.length];
}

/* ============================================================
   数据加载

   数据来自 posts-data.js（build_data.py 生成），
   通过 <script src> 注入到 window.__POSTS__，不涉及跨域请求，
   因此在 GitHub Pages 等纯静态托管上可直接运行。
   ============================================================ */

function loadBundle() {
  const bundle = window.__POSTS__;
  if (!bundle || !bundle.posts) {
    throw new Error('posts-data.js 未加载');
  }
  state.index = bundle.order.map(String);
  // 预先把精简元数据塞进缓存，避免排序时反复构造对象
  for (const id of state.index) {
    const p = bundle.posts[id];
    if (p) {
      state.cache.set(id, p);
      state.favMeta.set(id, {
        id,
        title: p.title,
        nick: (p.user && p.user.nick) || '匿名',
        hit: p.hit || 0,
        praise: p.praise || 0,
        imgCount: (p.images || []).length,
        createTime: p.createTime || 0
      });
    }
  }
}

async function loadIndex() {
  try {
    loadBundle();
  } catch (e) {
    state.index = [];
    showFatal(
      '数据文件未加载<br>' +
      '<span style="font-size:12px">请确认 posts-data.js 与本页在同一目录<br>' +
      '若未生成，运行 <code>python build_data.py</code></span>'
    );
    return;
  }
  $('topbarTitle').textContent = `共 ${state.index.length.toLocaleString()} 篇帖子`;
  updateRailCounts();
  updateStatLine();
}

/* 数据已全部预载进内存，这里直接命中缓存 */
async function getPost(id) {
  const key = String(id);
  if (state.cache.has(key)) return state.cache.get(key);
  throw new Error('post not found: ' + key);
}

/* 取用于排序的轻量元数据 */
async function peekMeta(id) {
  return state.favMeta.get(String(id)) || null;
}

/* ============================================================
   候选池构建
   ============================================================ */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* 排序：数据已全量预载进内存，因此直接对全部 2340 篇真实排序，
   不再需要采样（之前的采样是为了省掉 2340 次网络请求，现在没有请求了）。*/
const sortCache = new Map(); // sortKey -> 已排序的 id 数组

async function buildSorted(sort) {
  if (sortCache.has(sort)) return sortCache.get(sort);

  const minImg = Number($('minImgSel').value) || 0;
  const all = [];
  for (const id of state.index) {
    const m = state.favMeta.get(id);
    if (m) all.push(m);
  }

  let list = all.filter(m => !minImg || m.imgCount >= minImg);
  if ($('unseenChk').checked) {
    const fresh = list.filter(m => !state.seen.has(m.id));
    if (fresh.length) list = fresh;
  }

  const cmp = {
    hot:    (a, b) => b.hit - a.hit,
    praise: (a, b) => b.praise - a.praise,
    new:    (a, b) => b.createTime - a.createTime
  }[sort];

  if (cmp) list.sort(cmp);
  const ids = list.map(m => m.id);
  sortCache.set(sort, ids);
  return ids;
}

async function candidates() {
  const minImg = Number($('minImgSel').value) || 0;
  const sort = $('sortSel').value;
  const unseenOnly = $('unseenChk').checked;

  if (state.view === 'fav') {
    const ids = [...state.favs];
    return minImg ? ids : ids;
  }
  if (state.view === 'history') {
    return state.history.slice();
  }
  if (state.view === 'hot') {
    // 数据全量在内存，可按真实热度取前 200 篇，不足则回退随机
    if (!sortCache.has('hot')) {
      const ranked = [];
      for (const id of state.index) {
        const m = state.favMeta.get(id);
        if (m) ranked.push(m);
      }
      ranked.sort((a, b) => b.hit - a.hit);
      sortCache.set('hot', ranked.slice(0, 200).map(m => m.id));
    }
    return sortCache.get('hot');
  }

  if (sort !== 'random') {
    return buildSorted(sort);
  }

  let base = shuffle(state.index);
  if (unseenOnly) {
    const fresh = base.filter(id => !state.seen.has(id));
    if (fresh.length > 0) base = fresh;
    else toast('全部看过了，已切换为全量随机');
  }
  return base;
}

function matchesFilter(post) {
  const minImg = Number($('minImgSel').value) || 0;
  if (minImg && (post.images || []).length < minImg) return false;
  return true;
}

/* ============================================================
   渲染
   ============================================================ */
function showSkeleton() {
  $('viewerEmpty').hidden = false;
  $('viewerEmptyText').textContent = '加载中…';
  const v = $('viewer');
  v.querySelectorAll('img').forEach(i => i.remove());
  $('prevBtn').hidden = true;
  $('nextBtn').hidden = true;
  $('imgCounter').textContent = '0 / 0';
  $('progress').innerHTML = '';
  $('filmstrip').innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const d = document.createElement('div');
    d.className = 'thumb sk';
    $('filmstrip').appendChild(d);
  }
}

async function loadById(id) {
  if (!id) return;
  state.loading = true;
  showSkeleton();
  $('viewerEmptyText').textContent = '加载中…';

  let post;
  try {
    post = await getPost(id);
  } catch (e) {
    state.loading = false;
    $('viewerEmpty').hidden = false;
    $('viewerEmptyText').textContent = '这篇帖子加载失败';
    $('filmstrip').innerHTML = '';
    return;
  }

  // 不满足筛选条件时自动顺延
  if (!matchesFilter(post)) {
    state.loading = false;
    const next = state.pool[state.cursor + 1];
    if (next && next !== id) { state.cursor++; await loadById(next); }
    else { $('viewerEmptyText').textContent = '没有符合筛选条件的帖子'; $('filmstrip').innerHTML = ''; }
    return;
  }

  state.post = post;
  state.imgIdx = 0;

  state.seen.add(id);
  save(LS.seen, [...state.seen].slice(-4000));
  state.history = [id, ...state.history.filter(x => x !== id)].slice(0, 120);
  save(LS.hist, state.history);
  updateRailCounts();
  updateStatLine();

  renderAll();
  state.loading = false;
}

function renderAll() {
  const p = state.post;
  if (!p) return;
  renderViewer();
  renderPanel();
  syncFavButtons();
  document.title = `${p.title || '无标题'} · 取景台`;
}

function renderViewer() {
  const p = state.post;
  const imgs = p.images || [];
  const v = $('viewer');

  v.querySelectorAll('img').forEach(i => i.remove());

  if (imgs.length === 0) {
    $('viewerEmpty').hidden = false;
    $('viewerEmptyText').textContent = '这篇帖子没有图片';
    $('filmstrip').innerHTML = '';
    $('progress').innerHTML = '';
    $('imgCounter').textContent = '0 / 0';
    $('multiChip').hidden = true;
    $('prevBtn').hidden = true;
    $('nextBtn').hidden = true;
    return;
  }

  $('viewerEmpty').hidden = true;
  const img = document.createElement('img');
  img.className = 'viewer-img';
  img.alt = `${p.title || '帖子图片'} · 第 ${state.imgIdx + 1} / ${imgs.length} 张`;
  img.decoding = 'async';
  // 加载完成前先显示骨架，避免浏览器默认的破损图图标闪现
  img.style.opacity = '0';
  img.addEventListener('load', () => { img.style.opacity = '1'; });
  withImageFallback(img, imgs[state.imgIdx], p.postID);
  img.addEventListener('error', function () {
    this.replaceWith(Object.assign(document.createElement('div'), {
      className: 'viewer-empty',
      textContent: '图片加载失败'
    }));
  }, { once: true });
  img.src = localImagePath(imgs[state.imgIdx], p.postID);
  v.insertBefore(img, v.firstChild);

  const multi = imgs.length > 1;
  $('prevBtn').hidden = !multi;
  $('nextBtn').hidden = !multi;
  $('imgCounter').textContent = `${state.imgIdx + 1} / ${imgs.length}`;
  $('multiChip').hidden = !multi;
  $('multiChip').textContent = `多图 ${imgs.length}`;

  // 进度分栏
  const prog = $('progress');
  prog.innerHTML = '';
  for (let i = 0; i < imgs.length; i++) {
    const seg = document.createElement('div');
    seg.className = 'progress-seg';
    seg.dataset.on = String(i === state.imgIdx);
    seg.title = `第 ${i + 1} 张`;
    prog.appendChild(seg);
  }

  // 胶片条
  const strip = $('filmstrip');
  strip.innerHTML = '';
  imgs.forEach((url, i) => {
    const b = document.createElement('button');
    b.className = 'thumb';
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-current', String(i === state.imgIdx));
    b.setAttribute('aria-label', `查看第 ${i + 1} 张`);
    b.innerHTML = `<img src="${localImagePath(url, p.postID)}" alt="" loading="lazy" decoding="async">
      <span class="thumb-num">${i + 1}</span>`;
    b.addEventListener('click', () => { state.imgIdx = i; renderViewer(); });
    strip.appendChild(b);
  });

  // 当前缩略图滚入视野
  requestAnimationFrame(() => {
    const cur = strip.querySelector('[aria-current="true"]');
    if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
  });
}

function renderPanel() {
  const p = state.post;
  const u = p.user || {};
  const imgs = (p.images || []).length;
  const liked = state.liked.has(String(p.postID));
  const isFav = state.favs.has(String(p.postID));
  const hasLiked = (p.praise || 0) + (liked ? 1 : 0);
  const detail = p.detail || '';
  const long = detail.length > 110;

  const avatarInner = u.avatar
    ? `<img src="${escapeHtml(u.avatar)}" alt="" onerror="this.replaceWith(document.createTextNode('${escapeHtml((u.nick||'?').charAt(0))}'))">`
    : escapeHtml((u.nick || '?').charAt(0));

  const identity = u.identityTitle
    ? `<span class="author-badge">${escapeHtml(u.identityTitle)}</span>` : '';

  const metaRows = [
    ['帖子 ID', p.postID],
    ['发布时间', fmtDate(p.createTime)],
    ['图片数量', imgs + ' 张'],
    ['浏览 / 评论', `${fmtNum(p.hit)} / ${fmtNum(p.commentCount)}`]
  ].map(([k, v]) => `
    <div class="meta-row">
      <span class="meta-key">${k}</span>
      <span class="meta-val">${escapeHtml(v)}</span>
    </div>`).join('');

  $('panelInner').innerHTML = `
    <div class="panel-eyebrow">
      <span>${escapeHtml(u.nick || '匿名用户')}</span>
      <span>·</span>
      <span>${u.age ? escapeHtml(u.age) + ' 岁' : '年龄未知'}</span>
    </div>

    <h1 class="panel-title">${escapeHtml(p.title || '无标题')}</h1>

    <p class="panel-detail${long ? ' clamped' : ''}" id="detailEl">${escapeHtml(detail) || '<span style="color:var(--ink-4)">作者没有写正文</span>'}</p>
    ${long ? '<button class="link-more" id="moreBtn">展开全文</button>' : ''}

    <div class="divider"></div>

    <div class="author">
      <div class="avatar" style="background:${avatarColor(u.userID)}">${avatarInner}</div>
      <div class="author-meta">
        <div class="author-name">${escapeHtml(u.nick || '匿名用户')} ${identity}</div>
        <div class="author-sub">
          Lv.${escapeHtml(u.level ?? 1)}${u.experience ? ' · ' + fmtNum(u.experience) + ' 经验' : ''}
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="stats">
      <div><div class="stat-num">${fmtNum(p.hit)}</div><div class="stat-label">浏览</div></div>
      <div><div class="stat-num">${fmtNum(p.commentCount)}</div><div class="stat-label">评论</div></div>
      <div class="stat--accent"><div class="stat-num">${fmtNum(hasLiked)}</div><div class="stat-label">点赞</div></div>
    </div>
    ${(p.hit || 0) + (p.commentCount || 0) + (p.praise || 0) === 0
      ? '<p style="font-size:12px;color:var(--ink-4);margin-top:10px;line-height:1.6">这篇帖子的原始数据没有互动统计，可能是一篇未被顶起的旧帖。</p>'
      : ''}

    <div class="actions">
      <button class="action" id="likeBtn" aria-pressed="${liked}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span>${liked ? '已赞' : '点赞'}</span>
      </button>
      <button class="action" id="panelFavBtn" aria-pressed="${isFav}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span>${isFav ? '已收藏' : '收藏'}</span>
      </button>
      <button class="action" id="shareBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
        <span>分享</span>
      </button>
    </div>

    <div class="divider"></div>

    <div class="meta-list">${metaRows}</div>
  `;

  const moreBtn = $('moreBtn');
  if (moreBtn) {
    moreBtn.addEventListener('click', () => {
      const el = $('detailEl');
      const clamped = el.classList.toggle('clamped');
      moreBtn.textContent = clamped ? '展开全文' : '收起';
    });
  }
  $('likeBtn').addEventListener('click', toggleLike);
  $('panelFavBtn').addEventListener('click', toggleFav);
  $('shareBtn').addEventListener('click', sharePost);
}

function showFatal(html) {
  $('viewerEmpty').hidden = false;
  $('viewerEmpty').innerHTML = `<div style="text-align:center;line-height:1.8">${html}</div>`;
  $('filmstrip').innerHTML = '';
  $('topbarTitle').textContent = '数据加载失败';
}

function updateRailCounts() {
  $('favCount').textContent = state.favs.size;
  $('histCount').textContent = state.history.length;
}
function updateStatLine() {
  $('statLine').textContent = `已看 ${state.seen.size} 篇 · 缓存 ${state.cache.size} 篇`;
}

/* ============================================================
   交互
   ============================================================ */
function nextImage() {
  const imgs = state.post?.images || [];
  if (imgs.length <= 1) return;
  state.imgIdx = (state.imgIdx + 1) % imgs.length;
  renderViewer();
}
function prevImage() {
  const imgs = state.post?.images || [];
  if (imgs.length <= 1) return;
  state.imgIdx = (state.imgIdx - 1 + imgs.length) % imgs.length;
  renderViewer();
}

async function nextPost(dir = 1) {
  if (state.loading) return;
  if (state.pool.length === 0) {
    state.pool = await candidates();
    state.cursor = -1;
    if (state.pool.length === 0) {
      toast(state.view === 'fav' ? '收藏夹还是空的' : '没有可显示的帖子');
      return;
    }
  }
  state.cursor += dir;
  if (state.cursor < 0) state.cursor = state.pool.length - 1;
  if (state.cursor >= state.pool.length) {
    if (state.view === 'fav' || state.view === 'history') {
      state.cursor = 0;
      toast('已到列表末尾');
    } else {
      state.pool = await candidates();
      state.cursor = 0;
      if (state.pool.length === 0) { toast('没有符合筛选条件的帖子'); return; }
    }
  }
  await loadById(state.pool[state.cursor]);
}
function prevPost() { return nextPost(-1); }

async function jumpPost() {
  if (state.loading) return;
  const sort = $('sortSel').value;
  state.pool = await candidates();
  if (state.pool.length === 0) { toast('没有符合筛选条件的帖子'); return; }

  let idx;
  if (sort !== 'random' && state.view === 'random') {
    // 排序视图：从最热/最新的一端顺序浏览，否则排序就失去了意义
    idx = 0;
  } else {
    // 随机视图：随机取一篇，并尽量避开当前这篇
    idx = Math.floor(Math.random() * state.pool.length);
    if (state.pool.length > 1 && state.pool[idx] === String(state.post?.postID)) {
      idx = (idx + 1) % state.pool.length;
    }
  }
  state.cursor = idx;
  await loadById(state.pool[idx]);
}

function toggleFav() {
  const p = state.post;
  if (!p) return;
  const id = String(p.postID);
  if (state.favs.has(id)) {
    state.favs.delete(id);
    save(LS.fav, [...state.favs]);
    toast('已取消收藏');
  } else {
    state.favs.add(id);
    save(LS.fav, [...state.favs]);
    state.favMeta.set(id, { title: p.title, nick: p.user?.nick });
    toast('已加入收藏');
  }
  updateRailCounts();
  syncFavButtons();
  const btn = $('panelFavBtn');
  if (btn) {
    const on = state.favs.has(id);
    btn.setAttribute('aria-pressed', String(on));
    btn.querySelector('span').textContent = on ? '已收藏' : '收藏';
  }
}

function toggleLike() {
  const p = state.post;
  if (!p) return;
  const id = String(p.postID);
  if (state.liked.has(id)) {
    state.liked.delete(id);
    toast('已取消点赞');
  } else {
    state.liked.add(id);
    save(LS.liked, [...state.liked]);
    toast('已点赞');
  }
  const btn = $('likeBtn');
  if (btn) {
    const on = state.liked.has(id);
    btn.setAttribute('aria-pressed', String(on));
    btn.querySelector('span').textContent = on ? '已赞' : '点赞';
  }
  const base = p.praise || 0;
  const num = document.querySelector('.stat--accent .stat-num');
  if (num) num.textContent = fmtNum(base + (state.liked.has(id) ? 1 : 0));
}

function syncFavButtons() {
  const p = state.post;
  if (!p) return;
  const on = state.favs.has(String(p.postID));
  $('favBtn').setAttribute('aria-pressed', String(on));
  $('favBtnText').textContent = on ? '已收藏' : '收藏';
  $('mFavBtn').setAttribute('aria-pressed', String(on));
}

async function sharePost() {
  const p = state.post;
  if (!p) return;
  const text = `${p.title || '无标题'} — 取景台 #${p.postID}`;
  const url = location.href;
  try {
    if (navigator.share) { await navigator.share({ title: text, url }); return; }
    await navigator.clipboard.writeText(`${text}\n${url}`);
    toast('链接已复制到剪贴板');
  } catch {
    toast('复制失败，可手动复制地址栏链接');
  }
}

/* 灯箱 */
function openLightbox() {
  const p = state.post;
  const imgs = p?.images || [];
  if (imgs.length === 0) return;
  $('lightbox').hidden = false;
  $('lbTitle').textContent = p.title || '';
  renderLightbox();
  $('lbClose').focus();
}
function closeLightbox() {
  $('lightbox').hidden = true;
  $('lightboxBtn').focus();
}
function renderLightbox() {
  const p = state.post;
  const imgs = p.images || [];
  $('lbImg').src = localImagePath(imgs[state.imgIdx], p.postID);
  $('lbImg').alt = `${p.title || '帖子图片'} · 第 ${state.imgIdx + 1} / ${imgs.length} 张`;
  $('lbPrev').hidden = imgs.length <= 1;
  $('lbNext').hidden = imgs.length <= 1;

  const foot = $('lbFoot');
  foot.innerHTML = '';
  imgs.forEach((url, i) => {
    const b = document.createElement('button');
    b.className = 'thumb';
    b.style.opacity = i === state.imgIdx ? '1' : '0.45';
    b.style.borderColor = i === state.imgIdx ? 'var(--accent)' : 'transparent';
    b.setAttribute('aria-label', `第 ${i + 1} 张`);
    b.innerHTML = `<img src="${localImagePath(url, p.postID)}" alt="" loading="lazy">`;
    b.addEventListener('click', () => { state.imgIdx = i; renderLightbox(); renderViewer(); });
    foot.appendChild(b);
  });
  const counter = document.createElement('span');
  counter.className = 'lb-count';
  counter.textContent = `${state.imgIdx + 1} / ${imgs.length}`;
  foot.appendChild(counter);
  const cur = foot.querySelectorAll('.thumb')[state.imgIdx];
  if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'center' });
}

/* 主题与适应方式 */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  save(LS.theme, t);
  $('themeBtn').setAttribute('aria-pressed', String(t === 'dark'));
  $('themeIcon').innerHTML = t === 'dark'
    ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
    : '<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
}
function toggleTheme() {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
}
function applyFit(f) {
  state.fit = f;
  $('viewer').dataset.fit = f;
  $('fitChip').textContent = f === 'cover' ? '铺满舞台' : '完整显示';
  save(LS.fit, f);
}
function toggleFit() { applyFit(state.fit === 'cover' ? 'contain' : 'cover'); }

/* 视图切换 */
async function switchView(view) {
  state.view = view;
  document.querySelectorAll('.rail-item').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.view === view)));
  $('sortSel').value = 'random';
  state.pool = await candidates();
  state.cursor = -1;
  if (state.pool.length === 0) {
    const msg = view === 'fav' ? '还没有收藏任何帖子'
      : view === 'history' ? '还没有浏览记录' : '没有符合条件的帖子';
    showEmptyPanel(msg);
    $('viewerEmpty').hidden = false;
    $('viewerEmptyText').textContent = msg;
    $('filmstrip').innerHTML = '';
    $('progress').innerHTML = '';
    $('imgCounter').textContent = '0 / 0';
    state.post = null;
    return;
  }
  await jumpPost();
}
function showEmptyPanel(msg) {
  $('panelInner').innerHTML = `
    <div class="empty" style="padding:48px 0">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
        <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
      </svg>
      <div class="empty-title">${escapeHtml(msg)}</div>
      <div class="empty-text">在浏览帖子时点击收藏，它会出现在这里</div>
    </div>`;
}

/* ============================================================
   事件绑定
   ============================================================ */
function bind() {
  $('prevBtn').addEventListener('click', prevImage);
  $('nextBtn').addEventListener('click', nextImage);
  $('nextPostBtn').addEventListener('click', () => nextPost(1));
  $('prevPostBtn').addEventListener('click', () => prevPost());
  $('nextPostBtn2').addEventListener('click', jumpPost);
  $('mNextBtn').addEventListener('click', jumpPost);
  $('favBtn').addEventListener('click', toggleFav);
  $('mFavBtn').addEventListener('click', toggleFav);
  $('themeBtn').addEventListener('click', toggleTheme);
  $('fitChip').addEventListener('click', toggleFit);
  $('fitChip').addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleFit(); }
  });
  $('lightboxBtn').addEventListener('click', openLightbox);
  $('mLightboxBtn').addEventListener('click', openLightbox);
  $('lbClose').addEventListener('click', closeLightbox);
  $('lbPrev').addEventListener('click', e => { e.stopPropagation(); prevImage(); renderLightbox(); });
  $('lbNext').addEventListener('click', e => { e.stopPropagation(); nextImage(); renderLightbox(); });
  $('lightbox').addEventListener('click', e => { if (e.target === $('lightbox')) closeLightbox(); });

  $('shortcutsBtn').addEventListener('click', () => { $('shortcuts').hidden = false; });
  $('shortcuts').addEventListener('click', e => { if (e.target === $('shortcuts')) $('shortcuts').hidden = true; });

  document.querySelectorAll('.rail-item').forEach(b =>
    b.addEventListener('click', () => switchView(b.dataset.view)));

  ['sortSel', 'minImgSel', 'unseenChk'].forEach(id => {
    $(id).addEventListener('change', async () => {
      if (!state.post) return;
      // 筛选或排序条件变了，缓存的排序结果不再适用
      if (id === 'sortSel' || id === 'minImgSel' || id === 'unseenChk') {
        sortCache.clear();
      }
      state.pool = await candidates();
      if (state.pool.length === 0) { toast('没有符合筛选条件的帖子'); return; }
      state.cursor = state.pool.indexOf(String(state.post.postID));
      if (state.cursor < 0) { await jumpPost(); return; }
      if (!matchesFilter(state.post)) await jumpPost();
      else toast('筛选已更新');
    });
  });

  // 图片区打开灯箱：桌面用双击，触屏用单击（触屏无双击语义且易误触）
  const canHover = matchMedia('(hover: hover) and (pointer: fine)').matches;
  if (canHover) {
    $('viewer').addEventListener('dblclick', openLightbox);
  } else {
    $('viewer').addEventListener('click', e => {
      // 点在导航/放大按钮上时不触发
      if (e.target.closest('.viewer-nav, .viewer-zoom')) return;
      openLightbox();
    });
  }

  // 触摸滑动切图
  let tx = 0, ty = 0, tScroll = 0;
  $('viewer').addEventListener('touchstart', e => {
    tx = e.changedTouches[0].clientX;
    ty = e.changedTouches[0].clientY;
    tScroll = Date.now();
  }, { passive: true });
  $('viewer').addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    const dt = Date.now() - tScroll;
    // 阈值 48px + 500ms 内，避免拖动浏览与长按误判为翻页
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) && dt < 700) {
      if (e.target.closest('.viewer-nav, .viewer-zoom')) return;
      dx < 0 ? nextImage() : prevImage();
      e.preventDefault();
    }
  }, { passive: false });

  // 键盘
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;

    if (e.key === 'Escape') {
      if (!$('lightbox').hidden) { closeLightbox(); return; }
      if (!$('shortcuts').hidden) { $('shortcuts').hidden = true; return; }
    }
    if (!$('lightbox').hidden) {
      if (e.key === 'ArrowLeft') { prevImage(); renderLightbox(); e.preventDefault(); }
      if (e.key === 'ArrowRight') { nextImage(); renderLightbox(); e.preventDefault(); }
      return;
    }
    if (!$('shortcuts').hidden) return;

    switch (e.key) {
      case 'ArrowLeft': prevImage(); e.preventDefault(); break;
      case 'ArrowRight': nextImage(); e.preventDefault(); break;
      case 'ArrowUp': nextPost(-1); e.preventDefault(); break;
      case 'ArrowDown': nextPost(1); e.preventDefault(); break;
      case ' ': case 'n': case 'N': jumpPost(); e.preventDefault(); break;
      case 'j': case 'J': nextPost(1); break;
      case 'k': case 'K': nextPost(-1); break;
      case 'f': case 'F': toggleFav(); break;
      case 'l': case 'L': toggleLike(); break;
      case 'z': case 'Z': openLightbox(); break;
      case 'c': case 'C': toggleFit(); break;
      case 'd': case 'D': toggleTheme(); break;
      case '?': $('shortcuts').hidden = false; break;
    }
  });
}

/* ============================================================
   启动
   ============================================================ */
async function init() {
  applyTheme(load(LS.theme, matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  applyFit(load(LS.fit, 'contain'));
  bind();
  showSkeleton();
  await loadIndex();
  if (state.index.length > 0) await jumpPost();
  watchSystemTheme();
}

/* 用户未手动设置过主题时，跟随系统实时切换（跨设备同步的关键） */
function watchSystemTheme() {
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const onChange = e => {
    if (localStorage.getItem(LS.theme)) return; // 用户已显式选择，不打扰
    applyTheme(e.matches ? 'dark' : 'light');
  };
  if (mq.addEventListener) mq.addEventListener('change', onChange);
  else if (mq.addListener) mq.addListener(onChange); // Safari < 14
}

/* 等待数据 bundle 就绪后再启动。
   bundle 用 <script> 同步引入，理论上执行到这里时已就绪；
   但若将来改为异步加载或走 CDN，需要等待 load 事件，故做双重兜底。 */
function whenDataReady(cb) {
  if (window.__POSTS__) { cb(); return; }
  let waited = 0;
  const timer = setInterval(() => {
    if (window.__POSTS__ || waited > 100) {   // 最多等 10 秒
      clearInterval(timer);
      cb();
    }
    waited++;
  }, 100);
}

whenDataReady(init);
</script>
