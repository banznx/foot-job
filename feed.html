<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>信息流 · 取景台</title>
<style>
/* ============================================================
   设计令牌 —— 与 ui-v2.html 保持同一套视觉语言
   ============================================================ */
:root {
  --canvas: #FBFAF8;
  --surface: #FFFFFF;
  --surface-2: #F4F2EE;
  --surface-3: #ECEAE4;
  --scrim: rgba(26, 25, 23, 0.72);

  --ink-1: #1A1917;
  --ink-2: #57534E;
  --ink-3: #8A857D;
  --ink-4: #B4AFA6;

  --line-1: rgba(26, 25, 23, 0.10);
  --line-2: rgba(26, 25, 23, 0.18);
  --line-3: rgba(26, 25, 23, 0.32);

  --accent: #9A3B2E;
  --accent-hover: #8A3626;
  --accent-soft: #F6E7E3;
  --accent-ink: #8A3626;
  --teal: #2F6F62;
  --teal-soft: #E4F0EC;

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
  --font-num: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;

  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px; --s12: 48px;

  --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-xl: 16px; --r-full: 999px;

  --sh-1: 0 1px 2px rgba(26,25,23,0.05);
  --sh-2: 0 4px 16px rgba(26,25,23,0.08);
  --sh-3: 0 16px 48px rgba(26,25,23,0.16);

  --t-fast: 140ms cubic-bezier(0.4, 0, 0.2, 1);
  --t-mid: 240ms cubic-bezier(0.4, 0, 0.2, 1);

  --feed-max: 640px;
  --rail-w: 232px;
  --topbar-h: 56px;
}

[data-theme="dark"] {
  --canvas: #131211;
  --surface: #1C1A19;
  --surface-2: #262322;
  --surface-3: #322F2D;
  --scrim: rgba(0, 0, 0, 0.78);
  --ink-1: #F5F3F0;
  --ink-2: #B8B2AA;
  --ink-3: #8A857D;
  --ink-4: #635E58;
  --line-1: rgba(245, 243, 240, 0.12);
  --line-2: rgba(245, 243, 240, 0.20);
  --line-3: rgba(245, 243, 240, 0.34);
  --accent: #C9705F;
  --accent-hover: #D67F6E;
  --accent-soft: #3A2420;
  --accent-ink: #E8A392;
  --teal: #6FB3A2;
  --teal-soft: #1E302C;
  --sh-1: 0 1px 2px rgba(0,0,0,0.4);
  --sh-2: 0 4px 16px rgba(0,0,0,0.5);
  --sh-3: 0 16px 48px rgba(0,0,0,0.6);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  font-family: var(--font);
  background: var(--canvas);
  color: var(--ink-1);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }

button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
img { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
::selection { background: var(--accent-soft); color: var(--accent-ink); }

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
[hidden] { display: none !important; }

@keyframes shimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
.sk {
  background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%);
  background-size: 800px 100%;
  animation: shimmer 1.4s linear infinite;
  border-radius: var(--r-sm);
}

/* ============================================================
   布局
   ============================================================ */
.app {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas:
    "brand topbar"
    "rail  main";
  min-height: 100dvh;
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}

.brand {
  grid-area: brand;
  display: flex; align-items: center; gap: var(--s3);
  padding: 0 var(--s5);
  padding-top: env(safe-area-inset-top);
  min-height: calc(var(--topbar-h) + env(safe-area-inset-top));
  background: var(--surface);
  border-right: 1px solid var(--line-1);
  border-bottom: 1px solid var(--line-1);
}
.brand-mark {
  width: 26px; height: 26px; border-radius: 7px;
  background: var(--accent);
  display: grid; place-items: center; flex-shrink: 0;
}
.brand-name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.brand-sub { font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; }

.topbar {
  grid-area: topbar;
  display: flex; align-items: center; gap: var(--s3);
  padding: 0 var(--s5);
  padding-top: env(safe-area-inset-top);
  height: calc(var(--topbar-h) + env(safe-area-inset-top));
  background: var(--surface);
  border-bottom: 1px solid var(--line-1);
  position: sticky; top: 0; z-index: 20;
}
.topbar-title { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.topbar-spacer { flex: 1; }

.icon-btn {
  width: 34px; height: 34px; border-radius: var(--r-md);
  display: grid; place-items: center; color: var(--ink-2);
  transition: background var(--t-fast), color var(--t-fast);
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink-1); }

/* 左栏 */
.rail {
  grid-area: rail;
  background: var(--surface);
  border-right: 1px solid var(--line-1);
  padding: var(--s5) var(--s3);
  display: flex; flex-direction: column; gap: var(--s6);
  position: sticky; top: calc(var(--topbar-h) + env(safe-area-inset-top));
  height: calc(100dvh - var(--topbar-h) - env(safe-area-inset-top));
  overflow-y: auto;
}
.rail-label {
  font-size: 11px; font-weight: 600; color: var(--ink-3);
  letter-spacing: 0.06em; padding: 0 var(--s3) var(--s2);
}
.rail-group { display: flex; flex-direction: column; gap: 2px; }
.rail-item {
  display: flex; align-items: center; gap: var(--s3);
  width: 100%; padding: 9px var(--s3);
  border-radius: var(--r-md);
  font-size: 14px; color: var(--ink-2); text-align: left;
  transition: background var(--t-fast), color var(--t-fast);
}
.rail-item:hover { background: var(--surface-2); color: var(--ink-1); }
.rail-item[aria-current="true"] {
  background: var(--accent-soft); color: var(--accent-ink); font-weight: 500;
}
.rail-count { margin-left: auto; font-family: var(--font-num); font-size: 11px; color: var(--ink-3); }

.rail-note {
  margin-top: auto; padding: var(--s3);
  font-size: 11px; color: var(--ink-4); line-height: 1.7;
  border-top: 1px solid var(--line-1);
}
.rail-note b { color: var(--ink-2); font-weight: 500; }

/* ============================================================
   信息流主体
   ============================================================ */
.main {
  grid-area: main;
  padding: var(--s5) var(--s4) 0;
  padding-bottom: env(safe-area-inset-bottom);
}
.feed {
  max-width: var(--feed-max);
  margin-inline: auto;
  display: flex; flex-direction: column; gap: var(--s4);
}

/* 分类筛选条 */
.chips {
  display: flex; gap: var(--s2);
  overflow-x: auto; padding-bottom: var(--s2);
  scrollbar-width: none;
  position: sticky; top: calc(var(--topbar-h) + env(safe-area-inset-top));
  background: var(--canvas);
  z-index: 10;
  padding-top: var(--s2);
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  padding: 7px 14px;
  border-radius: var(--r-full);
  background: var(--surface);
  border: 1px solid var(--line-1);
  font-size: 13px; color: var(--ink-2);
  white-space: nowrap;
  transition: all var(--t-fast);
}
.chip:hover { border-color: var(--line-2); color: var(--ink-1); }
.chip[aria-pressed="true"] {
  background: var(--accent); color: #fff; border-color: transparent; font-weight: 500;
}
[data-theme="dark"] .chip[aria-pressed="true"] { color: #1A1917; }

/* ---- 卡片 ---- */
.card {
  background: var(--surface);
  border: 1px solid var(--line-1);
  border-radius: var(--r-lg);
  padding: var(--s4);
  animation: cardIn var(--t-mid);
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 作者行 */
.c-head { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s3); }
.c-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center; flex-shrink: 0;
  color: #fff; font-size: 15px; font-weight: 500;
}
.c-author { min-width: 0; flex: 1; }
.c-name {
  font-size: 14px; font-weight: 500;
  display: flex; align-items: center; gap: 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.c-badge {
  font-size: 10px; font-weight: 500;
  padding: 1px 5px; border-radius: 4px;
  background: var(--accent-soft); color: var(--accent-ink);
  flex-shrink: 0;
}
.c-meta { font-size: 12px; color: var(--ink-3); margin-top: 1px; }

/* 标题正文 */
.c-title {
  font-size: 16px; font-weight: 600; line-height: 1.45;
  margin-bottom: 6px; letter-spacing: -0.005em;
  overflow-wrap: anywhere;
}
.c-title a { color: inherit; text-decoration: none; }
.c-title a:hover { color: var(--accent-ink); }
.c-detail {
  font-size: 14px; line-height: 1.7; color: var(--ink-2);
  margin-bottom: var(--s3);
  overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 3;
  -webkit-box-orient: vertical; overflow: hidden;
}
.c-detail.single { -webkit-line-clamp: 2; }

/* ---- 图片区：懒加载 ---- */
.c-imgs {
  display: grid; gap: 3px;
  border-radius: var(--r-md); overflow: hidden;
  margin-bottom: var(--s3);
}
.c-imgs[data-n="1"] { grid-template-columns: 1fr; max-width: 420px; }
.c-imgs[data-n="2"] { grid-template-columns: 1fr 1fr; }
.c-imgs[data-n="3"] { grid-template-columns: 1fr 1fr; }
.c-imgs[data-n="4"] { grid-template-columns: 1fr 1fr; }
.c-imgs[data-n="many"] { grid-template-columns: repeat(3, 1fr); }

.ph {
  position: relative;
  background: var(--surface-2);
  overflow: hidden;
  aspect-ratio: 1 / 1;
}
.c-imgs[data-n="1"] .ph { aspect-ratio: 4 / 3; }
/* 九宫格统一 3×3 方格，不做跨列。
   试过首图跨两列 + aspect-ratio 2/1，但 grid 行高由最高元素决定，
   跨列元素的高度计算会与相邻方格产生偏差，导致首行下方留白。
   统一 1:1 最稳定，视觉上也是主流信息流的九宫格形态。 */

.ph img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; display: block;
  opacity: 0;
  transition: opacity var(--t-mid);
}
.ph img.loaded { opacity: 1; }

/* 未加载时的骨架 */
.ph::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%);
  background-size: 800px 100%;
  animation: shimmer 1.4s linear infinite;
}
.ph.ready::before { display: none; }

.ph-more {
  position: absolute; inset: 0;
  background: rgba(26,25,23,0.48);
  color: #fff;
  display: grid; place-items: center;
  font-size: 15px; font-weight: 500;
}

/* 无图占位 */
.c-noimg {
  display: flex; align-items: center; gap: var(--s2);
  padding: var(--s4);
  background: var(--surface-2);
  border-radius: var(--r-md);
  color: var(--ink-3); font-size: 13px;
  margin-bottom: var(--s3);
}

/* 互动栏 */
.c-actions {
  display: flex; align-items: center; gap: var(--s5);
  padding-top: var(--s3);
  border-top: 1px solid var(--line-1);
}
.c-act {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 13px; color: var(--ink-3);
  padding: 4px 2px; border-radius: var(--r-sm);
  transition: color var(--t-fast);
  font-variant-numeric: tabular-nums;
}
.c-act:hover { color: var(--ink-1); }
.c-act[aria-pressed="true"] { color: var(--accent); }
.c-act[aria-pressed="true"] svg { fill: currentColor; }
.c-act-spacer { flex: 1; }

/* 探索标记 —— 制造「算法给你推了冷门」的感觉 */
.c-flag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; font-weight: 500;
  color: var(--teal); background: var(--teal-soft);
  padding: 2px 6px; border-radius: 4px;
}

/* ---- 加载哨兵 ---- */
.sentinel {
  height: 1px;
  margin: var(--s2) 0;
}
.loading-row {
  display: flex; align-items: center; justify-content: center;
  gap: var(--s3);
  padding: var(--s6) 0;
  color: var(--ink-3); font-size: 13px;
}
.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--surface-3);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.end-mark {
  text-align: center;
  padding: var(--s8) 0 var(--s10);
  color: var(--ink-4); font-size: 12px;
}
.end-mark::before {
  content: ''; display: block;
  width: 40px; height: 1px; background: var(--line-2);
  margin: 0 auto var(--s3);
}

/* 回到顶部 */
.to-top {
  position: fixed; right: var(--s5); bottom: var(--s5);
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--surface); color: var(--ink-1);
  border: 1px solid var(--line-2);
  box-shadow: var(--sh-2);
  display: grid; place-items: center;
  opacity: 0; pointer-events: none;
  transition: opacity var(--t-mid);
  z-index: 40;
}
.to-top.show { opacity: 1; pointer-events: auto; }
.to-top:hover { background: var(--surface-2); }

/* 灯箱 */
.lightbox {
  position: fixed; inset: 0;
  background: var(--scrim);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  z-index: 100;
  display: grid; grid-template-rows: auto minmax(0,1fr);
  animation: fadeIn var(--t-mid);
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
.lb-bar {
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s4) var(--s5);
  color: #F5F3F0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.45), transparent);
}
.lb-title { font-size: 13px; opacity: 0.85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-close { margin-left: auto; width: 34px; height: 34px; border-radius: var(--r-md); display: grid; place-items: center; color: #F5F3F0; }
.lb-close:hover { background: rgba(255,255,255,0.14); }
.lb-stage { position: relative; display: grid; place-items: center; padding: var(--s4); min-height: 0; }
.lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.lb-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,0.14); color: #fff;
  display: grid; place-items: center;
}
.lb-nav:hover { background: rgba(255,255,255,0.26); }
.lb-nav--prev { left: var(--s4); }
.lb-nav--next { right: var(--s4); }
.lb-foot {
  display: flex; gap: var(--s2); align-items: center; justify-content: center;
  padding: var(--s4);
  overflow-x: auto;
  background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
  min-height: 92px;
}
.lb-foot .thumb {
  flex: 0 0 auto; width: 56px; height: 56px;
  border-radius: var(--r-sm); overflow: hidden;
  border: 2px solid transparent; opacity: 0.5;
}
.lb-foot .thumb[aria-current="true"] { border-color: var(--accent); opacity: 1; }
.lb-foot .thumb img { width: 100%; height: 100%; object-fit: cover; }
.lb-count { font-family: var(--font-num); font-size: 12px; color: rgba(255,255,255,0.75); padding: 0 var(--s2); flex: 0 0 auto; }

/* Toast */
.toast-wrap {
  position: fixed; bottom: var(--s6); left: 50%;
  transform: translateX(-50%);
  z-index: 200; display: flex; flex-direction: column; gap: var(--s2);
  align-items: center; pointer-events: none;
  max-width: calc(100vw - 2 * var(--s5));
}
.toast {
  background: var(--ink-1); color: var(--canvas);
  font-size: 13px; font-weight: 500;
  padding: 10px 18px; border-radius: var(--r-full);
  box-shadow: var(--sh-3);
  animation: toastIn var(--t-mid);
}
[data-theme="dark"] .toast { background: #322F2D; color: #F5F3F0; border: 1px solid var(--line-2); }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(12px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ============================================================
   多端适配
   ============================================================ */

/* 平板竖屏：单栏过窄，信息流加宽 */
@media (min-width: 600px) and (max-width: 979px) {
  :root { --feed-max: 720px; }
}

/* lg 平板横屏 */
@media (min-width: 980px) and (max-width: 1279px) {
  :root { --feed-max: 660px; --rail-w: 200px; }
}

/* 超宽屏：限制阅读宽度，避免一行文字过长 */
@media (min-width: 1920px) {
  :root { --feed-max: 680px; --topbar-h: 64px; }
}

/* 平板竖屏与折叠屏：隐藏左栏，用顶部横向导航替代 */
@media (max-width: 979px) {
  :root { --topbar-h: 52px; }
  .app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "topbar" "main";
  }
  .brand, .rail { display: none; }
  .main { padding: var(--s3) var(--s3) 0; }
  .chips { top: calc(var(--topbar-h) + env(safe-area-inset-top)); }
  .c-detail { font-size: 15px; }  /* 移动端不小于 15px */
}

@media (max-width: 599px) {
  :root { --feed-max: 100%; }
  .card { padding: var(--s3); border-radius: var(--r-md); }
  .c-imgs[data-n="many"] { grid-template-columns: repeat(3, 1fr); }
  .lb-nav { width: 38px; height: 38px; }
}

@media (max-width: 359px) {
  :root { --topbar-h: 48px; }
  .main { padding: var(--s2) var(--s2) 0; }
  .card { padding: 10px; }
  .c-title { font-size: 15px; }
  .c-detail { font-size: 15px; }
  .c-avatar { width: 32px; height: 32px; font-size: 13px; }
  .c-actions { gap: var(--s4); }
}

/* 矮视口横屏 */
@media (max-height: 520px) and (orientation: landscape) {
  :root { --topbar-h: 44px; }
  .c-title { font-size: 15px; }
  .lb-foot { min-height: 72px; }
  .lb-foot .thumb { width: 44px; height: 44px; }
}

/* 触屏 */
@media (hover: none) and (pointer: coarse) {
  .c-act { padding: 8px 4px; min-height: 44px; }
  .icon-btn { width: 40px; height: 40px; }
  .lb-nav { opacity: 1; }
  .c-act:hover { color: var(--ink-3); }
  .c-act[aria-pressed="true"]:hover { color: var(--accent); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
  .sk, .ph::before { animation: none; }
}

@media print {
  .brand, .rail, .topbar, .chips, .c-actions, .to-top, .toast-wrap { display: none !important; }
  .app { display: block; }
  .c-imgs { break-inside: avoid; }
}
</style>
</head>
<body>

<div class="app">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 15l4-4 3 3 5-5"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">取景台</div>
      <div class="brand-sub">FEED</div>
    </div>

<script>
'use strict';

/* ============================================================
   配置
   ============================================================ */
const IMAGE_BASE = '';
const IMAGE_FALLBACK_BASE = '';
const LOCAL_IMAGES_DIR = 'images/downloaded_posts_images/';

const PAGE_SIZE = 10;          // 每次下拉加载条数
const AUTHOR_COOLDOWN = 8;     // 同一作者 N 条内不重复
const EXPLORE_EVERY = 9;       // 每 N 条插 1 条探索内容
const IMG_PRELOAD_AHEAD = 600; // 图片提前加载距离（px）

const LS = { liked: 'fd_liked', fav: 'fd_fav', theme: 'fd_theme', seen: 'fd_seen' };

/* ============================================================
   状态
   ============================================================ */
const state = {
  all: [],            // 全部帖子
  pool: [],           // 当前候选序列（已按推荐分排序）
  consumed: new Set(),// 已出现在信息流中的 id
  recentAuthors: [],  // 近期出现过的作者（用于打散）
  shownTitles: new Set(),
  exploreIds: new Set(),  // 本轮探索位标记（不写回帖子对象）
  view: 'smart',
  category: 'all',
  page: 0,
  loading: false,
  done: false,
  liked: new Set(load(LS.liked, [])),
  fav: new Set(load(LS.fav, [])),
  seen: new Set(load(LS.seen, []))
};

function load(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
const $ = id => document.getElementById(id);

/* ============================================================
   工具
   ============================================================ */
function fmtNum(n) {
  n = Number(n) || 0;
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + 'w';
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
  return String(n);
}
function fmtDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d)) return '';
  const diff = Date.now() - ts;
  const day = 86400000;
  if (diff < 0) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
  if (diff < day) return Math.floor(diff / 3600000) + ' 小时前';
  if (diff < day * 30) return Math.floor(diff / day) + ' 天前';
  if (diff < day * 365) return Math.floor(diff / (day * 30)) + ' 个月前';
  return Math.floor(diff / (day * 365)) + ' 年前';
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function imgPath(url, postID) {
  const name = String(url).split('/').pop().split('?')[0];
  const file = postID + '_' + name;
  if (IMAGE_BASE) return IMAGE_BASE + file;
  if (IMAGE_FALLBACK_BASE) return IMAGE_FALLBACK_BASE + file;
  return LOCAL_IMAGES_DIR + file;
}
const AVATAR_COLORS = ['#9A3B2E','#2F6F62','#7A5C9E','#B5762F','#3E6FA8','#A03C6B','#5A7A2F','#8C5A3C'];
function avatarColor(id) {
  return AVATAR_COLORS[Math.abs(Number(id) || 0) % AVATAR_COLORS.length];
}
function toast(msg) {
  const wrap = $('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .2s, transform .2s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    setTimeout(() => el.remove(), 220);
  }, 1700);
}

/* 从标题前缀提取分类：用于打散与筛选 */
const CATEGORIES = [
  { key: 'all',    label: '全部' },
  { key: '原创',    label: '原创' },
  { key: '举牌',    label: '举牌' },
  { key: '自拍',    label: '自拍' },
  { key: '美腿',    label: '美腿' },
  { key: '视频',    label: '视频' },
  { key: '其他',    label: '其他' }
];
function categoryOf(p) {
  const t = p.title || '';
  if (t.startsWith('【') && t.includes('】')) {
    const tag = t.slice(1, t.indexOf('】'));
    if (tag.includes('美腿')) return '美腿';
    if (tag.includes('视频')) return '视频';
    if (tag.includes('举牌')) return '举牌';
    if (tag.includes('自拍')) return '自拍';
    if (tag.includes('原创')) return '原创';
    return '其他';
  }
  if (t.includes('美腿')) return '美腿';
  if (t.includes('自拍')) return '自拍';
  return '其他';
}

/* ============================================================
   推荐算法

   目标：产出「看起来像算法推荐」但实际是纯随机的顺序。
   做法：加权打分 → 乘性随机扰动 → 贪心选择并实时打散。

   分数只在内部使用，界面上不暴露任何分数或权重。
   ============================================================ */
const NOW = Date.now();

function scoreOf(p, seed) {
  // 互动热度：对数缩放，避免头部帖子碾压长尾
  const heat = Math.log10(1 + (p.hit || 0) + (p.commentCount || 0) * 6 + (p.praise || 0) * 10);

  // 新鲜度：指数衰减，180 天半衰期
  const ageDays = Math.max(0, (NOW - (p.createTime || 0)) / 86400000);
  const fresh = Math.exp(-ageDays / 180);

  // 作者质量：等级为主，经验为辅（对数）
  const u = p.user || {};
  const quality = Math.min(1, ((u.level || 1) / 20) * 0.7 + Math.log10(1 + (u.experience || 0)) / 12 * 0.3);

  // 图量偏好：多图帖在信息流里停留更久，轻微加权
  const imgBoost = Math.min(1, (p.images || []).length / 6) * 0.1;

  let s = heat * 0.38 + fresh * 0.27 + quality * 0.15 + imgBoost;

  // 乘性随机扰动：这是「错觉」的关键 —— 分数高低不再完全决定顺序
  s *= (0.78 + (seed() * 0.44));   // 0.78 ~ 1.22

  return s;
}

function buildPool() {
  const seed = mulberry32(Date.now() & 0xffffffff);

  let base = state.all;
  if (state.view === 'fav') {
    base = state.all.filter(p => state.fav.has(String(p.postID)));
  } else if (state.category !== 'all') {
    base = base.filter(p => categoryOf(p) === state.category);
  }

  const scored = base
    .filter(p => !state.consumed.has(String(p.postID)))
    .map(p => ({ p, s: scoreOf(p, seed) }));

  // 视图决定基础倾向。统一返回 {list, exploreIds} 供渲染层消费。
  const empty = { list: [], exploreIds: new Set() };
  if (state.view === 'new') {
    scored.sort((a, b) => (b.p.createTime || 0) - (a.p.createTime || 0));
    // 最新视图按真实时间倒序，不参与打散——用户要看的就是「最新」
    return { list: scored.map(x => x.p), exploreIds: new Set() };
  }
  if (state.view === 'hot') {
    scored.sort((a, b) => b.s - a.s);
    // 热门视图按真实分数降序，但保留随机扰动带来的顺序变化
    return { list: scored.map(x => x.p), exploreIds: new Set() };
  }
  if (state.view === 'fav' && base.length === 0) return empty;

  // smart / fav 视图：贪心选择 + 实时打散
  return greedyScatter(scored);
}

/* 贪心打散：每一轮挑分数最高的候选，
   但若违反打散规则（作者太近 / 标题重复 / 分类连出）则顺延到下一个 */
function greedyScatter(scored) {
  scored.sort((a, b) => b.s - a.s);
  const out = [];
  const exploreIds = new Set();   // 本轮探索位，仅本次渲染有效
  let lastCat = null;
  let sinceExplore = 0;

  const violate = (item) => {
    const uid = (item.p.user || {}).userID;
    const pos = state.recentAuthors.lastIndexOf(uid);
    // 同一作者在最近 AUTHOR_COOLDOWN 条内出现过
    if (pos >= 0 && out.length - pos < AUTHOR_COOLDOWN) return true;
    if (state.shownTitles.has(item.p.title)) return true;
    if (categoryOf(item.p) === lastCat && out.length > 0) return true;
    return false;
  };

  let cursor = 0;
  let guard = 0;
  while (out.length < scored.length && guard < scored.length * 4) {
    guard++;
    // 找第一个不违规的
    while (cursor < scored.length && violate(scored[cursor])) cursor++;
    if (cursor >= scored.length) {
      // 约束太紧，放宽：清空标题与分类限制，只保留作者冷却
      state.shownTitles.clear();
      lastCat = null;
      cursor = 0;
      if (out.length >= scored.length) break;
      continue;
    }
    const item = scored[cursor];
    scored.splice(cursor, 1);
    out.push(item.p);

    state.recentAuthors.push((item.p.user || {}).userID);
    if (state.recentAuthors.length > 40) state.recentAuthors.shift();
    state.shownTitles.add(item.p.title);
    lastCat = categoryOf(item.p);

    // 探索位：每 N 条插一条低分内容，制造「算法偶尔推冷门」的观感
    sinceExplore++;
    if (sinceExplore >= EXPLORE_EVERY && scored.length) {
      const cold = scored.splice(Math.floor(scored.length * 0.72), 1)[0];
      if (cold) {
        state.recentAuthors.push((cold.p.user || {}).userID);
        if (state.recentAuthors.length > 40) state.recentAuthors.shift();
        state.shownTitles.add(cold.p.title);
        /* 探索位记在独立集合里，不写回帖子对象。
           帖子对象来自共享的 bundle，写入会永久残留，
           导致同一条目下次被推荐时仍带旧标记。 */
        exploreIds.add(String(cold.p.postID));
        out.push(cold.p);
        sinceExplore = 0;
      }
    }
  }

  // 兜底：把被约束卡住的剩余内容追加到末尾
  for (const item of scored) out.push(item.p);
  return { list: out, exploreIds };
}

/* 可复现的伪随机数（mulberry32） */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ============================================================
   渲染
   ============================================================ */
function renderChips() {
  const box = $('chips');
  box.innerHTML = CATEGORIES.map(c =>
    `<button class="chip" role="tab" data-cat="${escapeHtml(c.key)}"
       aria-pressed="${state.category === c.key}">${escapeHtml(c.label)}</button>`
  ).join('');
}

function cardHtml(p, idx) {
  const id = String(p.postID);
  const u = p.user || {};
  const imgs = p.images || [];
  const liked = state.liked.has(id);
  const faved = state.fav.has(id);
  const cat = categoryOf(p);

  // 图片区：1 / 2 / 3 / 4 / 多图 五种布局
  let imgHtml = '';
  if (imgs.length === 0) {
    imgHtml = `<div class="c-noimg">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M21 15l-5-5L5 21"/>
      </svg>
      这篇帖子没有配图
    </div>`;
  } else {
    const show = Math.min(imgs.length, 9);
    const layoutKey = imgs.length === 1 ? '1' : imgs.length === 2 ? '2'
      : imgs.length === 3 ? '3' : imgs.length === 4 ? '4' : 'many';
    let cells = '';
    for (let i = 0; i < show; i++) {
      cells += `<div class="ph" data-src="${escapeHtml(imgPath(imgs[i], p.postID))}"
                    data-alt="第 ${i + 1} 张" data-post="${escapeHtml(id)}" data-idx="${i}"></div>`;
    }
    if (imgs.length > 9) {
      cells += `<div class="ph"><div class="ph-more">+${imgs.length - 9}</div></div>`;
    }
    imgHtml = `<div class="c-imgs" data-n="${layoutKey}" data-post="${escapeHtml(id)}">${cells}</div>`;
  }

  const detail = p.detail || '';
  const flag = state.exploreIds.has(String(p.postID))
    ? `<span class="c-flag" title="算法根据你的浏览偏好推荐">
         <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.6 6.4 6.9.6-5.2 4.6 1.5 6.8L12 16.8 6.2 20.4l1.5-6.8L2.5 9l6.9-.6z"/></svg>
         为你推荐
       </span>` : '';

  return `
  <article class="card" data-post="${escapeHtml(id)}" data-idx="${idx}">
    <div class="c-head">
      <div class="c-avatar" style="background:${avatarColor(u.userID)}">${escapeHtml((u.nick || '?').charAt(0))}</div>
      <div class="c-author">
        <div class="c-name">
          ${escapeHtml(u.nick || '匿名用户')}
          ${u.identityTitle ? `<span class="c-badge">${escapeHtml(u.identityTitle)}</span>` : ''}
        </div>
        <div class="c-meta">
          Lv.${escapeHtml(u.level ?? 1)}${u.age ? ' · ' + escapeHtml(u.age) + ' 岁' : ''}
          ${p.createTime ? ' · ' + fmtDate(p.createTime) : ''}
          ${flag}
        </div>
      </div>
    </div>

    <h2 class="c-title">${escapeHtml(p.title || '无标题')}</h2>
    ${detail ? `<p class="c-detail${detail.length <= 60 ? ' single' : ''}">${escapeHtml(detail)}</p>` : ''}
    ${imgHtml}

    <div class="c-actions">
      <button class="c-act" data-like aria-pressed="${liked}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span>${liked ? fmtNum((p.praise || 0) + 1) : fmtNum(p.praise || 0)}</span>
      </button>
      <button class="c-act" data-open>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>${fmtNum(p.commentCount || 0)}</span>
      </button>
      <button class="c-act" data-eye>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>${fmtNum(p.hit || 0)}</span>
      </button>
      <span class="c-act-spacer"></span>
      <button class="c-act" data-fav aria-pressed="${faved}" aria-label="收藏">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      </button>
    </div>
  </article>`;
}

function renderSkeleton(n) {
  let html = '';
  for (let i = 0; i < n; i++) {
    html += `
    <article class="card">
      <div class="c-head">
        <div class="sk" style="width:38px;height:38px;border-radius:50%"></div>
        <div style="flex:1">
          <div class="sk" style="height:13px;width:96px;margin-bottom:6px"></div>
          <div class="sk" style="height:11px;width:150px"></div>
        </div>
      </div>
      <div class="sk" style="height:17px;width:88%;margin-bottom:8px"></div>
      <div class="sk" style="height:17px;width:56%;margin-bottom:12px"></div>
      <div class="sk" style="height:200px;width:100%;margin-bottom:12px"></div>
      <div class="sk" style="height:14px;width:100%;margin-bottom:6px"></div>
      <div class="sk" style="height:14px;width:72%"></div>
    </article>`;
  }
  $('feed').innerHTML = html;
}

/* ============================================================
   图片懒加载（IntersectionObserver）
   ============================================================ */
let io = null;
function initObserver() {
  if (io) io.disconnect();
  io = new IntersectionObserver(onIntersect, {
    rootMargin: '0px 0px ' + IMG_PRELOAD_AHEAD + 'px 0px',
    threshold: 0.01
  });
}
function onIntersect(entries) {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    const ph = e.target;
    io.unobserve(ph);
    loadImage(ph);
  }
}
function observeAll(root) {
  root.querySelectorAll('.ph[data-src]').forEach(ph => io.observe(ph));
}

/* 真正给 <img> 赋值。用 data-src 而非 src，保证离屏时不发起请求。 */
function loadImage(ph) {
  const src = ph.dataset.src;
  if (!src || ph.dataset.loading) return;
  ph.dataset.loading = '1';

  const img = document.createElement('img');
  img.alt = ph.dataset.alt || '';
  img.decoding = 'async';
  let triedFallback = false;
  img.addEventListener('load', () => {
    img.classList.add('loaded');
    ph.classList.add('ready');
  });
  img.addEventListener('error', () => {
    if (!triedFallback && IMAGE_FALLBACK_BASE) {
      triedFallback = true;
      const file = ph.dataset.src.split('/').pop();
      img.src = IMAGE_FALLBACK_BASE + file;
      return;
    }
    ph.classList.add('ready');
    ph.innerHTML = '<div class="ph-more" style="background:var(--surface-2);color:var(--ink-3);font-size:12px">加载失败</div>';
  });
  img.src = src;
  ph.appendChild(img);
}

/* ============================================================
   无限滚动（哨兵）
   ============================================================ */
let sentinelIo = null;
function initSentinel() {
  if (sentinelIo) sentinelIo.disconnect();
  sentinelIo = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) loadMore();
  }, { rootMargin: '400px 0px' });
  sentinelIo.observe($('sentinel'));
}

function setStatus(kind) {
  const box = $('statusArea');
  if (kind === 'loading') {
    box.innerHTML = `<div class="loading-row">
      <div class="spinner"></div><span>正在为你挑选…</span></div>`;
  } else if (kind === 'end') {
    box.innerHTML = `<div class="end-mark">已经到底了 · 共浏览 ${state.consumed.size} 篇</div>`;
  } else {
    box.innerHTML = '';
  }
}

function loadMore() {
  if (state.loading || state.done) return;
  state.loading = true;
  setStatus('loading');

  // 模拟网络延迟，让骨架屏有机会展示（真实环境也有这个过程）
  setTimeout(() => {
    if (state.page === 0) {
      const built = buildPool();
      state.pool = built.list;
      state.exploreIds = built.exploreIds;
    }

    const slice = state.pool.slice(state.page * PAGE_SIZE, (state.page + 1) * PAGE_SIZE);

    if (slice.length === 0) {
      state.done = true;
      state.loading = false;
      setStatus('end');
      return;
    }

    const feed = $('feed');
    if (state.page === 0) feed.innerHTML = '';
    const base = state.page * PAGE_SIZE;
    feed.insertAdjacentHTML('beforeend', slice.map((p, i) => cardHtml(p, base + i)).join(''));

    slice.forEach(p => {
      const id = String(p.postID);
      state.consumed.add(id);
      state.seen.add(id);
    });
    save(LS.seen, [...state.seen].slice(-3000));

    observeAll(feed);
    state.page++;
    state.loading = false;

    if (state.page * PAGE_SIZE >= state.pool.length) {
      state.done = true;
      setStatus('end');
    } else {
      setStatus('');
    }
    updateMeta();
  }, 260);
}

function resetFeed(keepScroll) {
  state.page = 0;
  state.done = false;
  state.loading = false;
  state.pool = [];
  state.recentAuthors = [];
  state.shownTitles = new Set();
  $('feed').setAttribute('aria-busy', 'true');
  renderSkeleton(4);
  if (!keepScroll) window.scrollTo({ top: 0 });
  loadMore();
  $('feed').setAttribute('aria-busy', 'false');
}

/* 换一批：清空消费记录，重新推荐 */
function reshuffle() {
  state.consumed.clear();
  state.recentAuthors = [];
  state.shownTitles = new Set();
  resetFeed();
  toast('已为你换一批');
}

function updateMeta() {
  $('topbarTitle').textContent = `已推荐 ${state.consumed.size} / ${state.all.length} 篇`;
  $('favCount').textContent = state.fav.size;
}

/* ============================================================
   灯箱
   ============================================================ */
let lbPost = null, lbIdx = 0;
function openLightbox(post, idx) {
  lbPost = post; lbIdx = idx;
  $('lightbox').hidden = false;
  $('lbTitle').textContent = post.title || '';
  renderLightbox();
  $('lbClose').focus();
}
function closeLightbox() { $('lightbox').hidden = true; }
function renderLightbox() {
  const imgs = lbPost.images || [];
  $('lbImg').src = imgPath(imgs[lbIdx], lbPost.postID);
  $('lbImg').alt = `${lbPost.title || '帖子图片'} · 第 ${lbIdx + 1} / ${imgs.length} 张`;
  $('lbPrev').hidden = imgs.length <= 1;
  $('lbNext').hidden = imgs.length <= 1;
  const foot = $('lbFoot');
  foot.innerHTML = '';
  imgs.forEach((u, i) => {
    const b = document.createElement('button');
    b.className = 'thumb';
    b.setAttribute('aria-current', String(i === lbIdx));
    b.setAttribute('aria-label', `第 ${i + 1} 张`);
    const im = document.createElement('img');
    im.src = imgPath(u, lbPost.postID);
    im.alt = '';
    im.loading = 'lazy';
    b.appendChild(im);
    b.addEventListener('click', () => { lbIdx = i; renderLightbox(); });
    foot.appendChild(b);
  });
  const c = document.createElement('span');
  c.className = 'lb-count';
  c.textContent = `${lbIdx + 1} / ${imgs.length}`;
  foot.appendChild(c);
  const cur = foot.querySelector('.thumb[aria-current="true"]');
  if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'center' });
}

/* ============================================================
   事件
   ============================================================ */
function findPost(id) {
  return state.all.find(p => String(p.postID) === String(id));
}

function bind() {
  // 分类切换
  $('chips').addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    state.category = btn.dataset.cat;
    $('chips').querySelectorAll('.chip').forEach(c =>
      c.setAttribute('aria-pressed', String(c.dataset.cat === state.category)));
    state.consumed.clear();
    resetFeed();
  });

  // 视图切换
  document.querySelectorAll('.rail-item').forEach(b =>
    b.addEventListener('click', () => {
      document.querySelectorAll('.rail-item').forEach(x =>
        x.setAttribute('aria-current', String(x === b)));
      state.view = b.dataset.sort;
      state.consumed.clear();
      resetFeed();
      if (state.view === 'fav' && state.fav.size === 0) {
        $('feed').innerHTML = `<div class="end-mark" style="padding:64px 0">
          还没有收藏任何内容<br><span style="font-size:12px">在卡片右下角点击书签图标</span></div>`;
        state.done = true;
      }
    }));

  $('refreshBtn').addEventListener('click', reshuffle);
  $('toTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  // 主题
  $('themeBtn').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    save(LS.theme, next);
  });

  // 卡片内交互（事件委托）
  $('feed').addEventListener('click', e => {
    const card = e.target.closest('.card');
    if (!card) return;
    const id = card.dataset.post;
    const p = findPost(id);
    if (!p) return;

    const likeBtn = e.target.closest('[data-like]');
    const favBtn = e.target.closest('[data-fav]');
    const openBtn = e.target.closest('[data-open]');
    const eyeBtn = e.target.closest('[data-eye]');

    if (likeBtn) {
      const key = String(p.postID);
      const on = !state.liked.has(key);
      if (on) state.liked.add(key); else state.liked.delete(key);
      save(LS.liked, [...state.liked]);
      likeBtn.setAttribute('aria-pressed', String(on));
      likeBtn.querySelector('span').textContent = fmtNum((p.praise || 0) + (on ? 1 : 0));
      return;
    }
    if (favBtn) {
      const key = String(p.postID);
      const on = !state.fav.has(key);
      if (on) state.fav.add(key); else state.fav.delete(key);
      save(LS.fav, [...state.fav]);
      favBtn.setAttribute('aria-pressed', String(on));
      updateMeta();
      toast(on ? '已收藏' : '已取消收藏');
      return;
    }
    if (openBtn || eyeBtn) {
      const imgs = p.images || [];
      if (imgs.length) openLightbox(p, 0);
      else toast('这篇帖子没有图片');
      return;
    }
  });

  // 点缩略图开灯箱
  $('feed').addEventListener('click', e => {
    const ph = e.target.closest('.ph');
    if (!ph || !ph.dataset.src) return;
    const card = ph.closest('.card');
    const p = findPost(card.dataset.post);
    if (p) openLightbox(p, Number(ph.dataset.idx) || 0);
  });

  // 灯箱
  $('lbClose').addEventListener('click', closeLightbox);
  $('lbPrev').addEventListener('click', () => {
    const imgs = lbPost.images || [];
    lbIdx = (lbIdx - 1 + imgs.length) % imgs.length;
    renderLightbox();
  });
  $('lbNext').addEventListener('click', () => {
    const imgs = lbPost.images || [];
    lbIdx = (lbIdx + 1) % imgs.length;
    renderLightbox();
  });
  $('lightbox').addEventListener('click', e => {
    if (e.target === $('lightbox')) closeLightbox();
  });

  // 回到顶部按钮显隐
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      $('toTop').classList.toggle('show', window.scrollY > 600);
      ticking = false;
    });
  }, { passive: true });

  // 键盘
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
    if (e.key === 'Escape' && !$('lightbox').hidden) { closeLightbox(); return; }
    if (!$('lightbox').hidden) {
      if (e.key === 'ArrowLeft') { $('lbPrev').click(); e.preventDefault(); }
      if (e.key === 'ArrowRight') { $('lbNext').click(); e.preventDefault(); }
      return;
    }
    if (e.key === 'n' || e.key === 'N') { reshuffle(); }
  });
}

function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $('themeIcon').innerHTML = t === 'dark'
    ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
    : '<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
}

/* ============================================================
   启动
   ============================================================ */
function init() {
  const bundle = window.__POSTS__;
  if (!bundle || !bundle.posts) {
    document.getElementById('feed').innerHTML =
      `<div class="end-mark" style="padding:64px 0">
        数据文件未加载<br><span style="font-size:12px">请确认 posts-data.js 与本页在同一目录</span></div>`;
    $('topbarTitle').textContent = '数据未加载';
    return;
  }
  state.all = bundle.order.map(id => bundle.posts[id]).filter(Boolean);

  applyTheme(load(LS.theme, matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  renderChips();
  bind();
  initObserver();
  initSentinel();
  resetFeed();
}

init();
</script>
