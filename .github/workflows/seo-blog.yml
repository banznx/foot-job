name: SEO Blog

# 每半小时跑一批，每批 1 篇；改动脚本或手动触发也会跑
on:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - 'seo/**'
      - '.github/workflows/seo-blog.yml'
  workflow_dispatch:
    inputs:
      batch:
        description: '本次生成篇数'
        default: '1'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 脚本自身被 bot 提交时不必再跑一遍，否则会无限循环
      - name: 防循环
        id: check
        run: |
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [[ "$(git log -1 --pretty='%ae')" == "github-actions[bot]@users.noreply.github.com" ]]; then
            echo "上一次是 bot 提交，跳过"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成文章
        if: steps.check.outputs.skip != 'true'
        env:
          BIGMODEL_API_KEY: ${{ secrets.BIGMODEL_API_KEY }}
        run: |
          BATCH="${{ github.event.inputs.batch }}"
          python seo/run.py --batch "${BATCH:-1}"

      - name: 推送搜索引擎
        if: success() && steps.check.outputs.skip != 'true'
        env:
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: python seo/push.py

      - name: 提交诊断日志
        # 无论成败都要落盘。生成失败时下面的提交步骤不会执行，
        # 而失败原因恰恰只存在于这个日志里，不提交就等于没法排查。
        if: always() && steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seo/api-log.json
          if git diff --staged --quiet; then
            echo "诊断日志无变化"
            exit 0
          fi
          git commit -m "chore(seo): 记录接口诊断"
          for i in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then
              echo "诊断日志已提交"
              exit 0
            fi
            git rebase --abort || true
            sleep $((i * 10))
          done
          echo "诊断日志推送失败，等下一轮"

      - name: 提交
        if: success() && steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/ sitemap.xml seo/ledger.json seo/push-log.json seo/api-log.json
          if git diff --staged --quiet; then
            echo "没有变更，跳过提交"
            exit 0
          fi
          git commit -m "chore(seo): 新增分享内容 $(date -u '+%Y-%m-%d %H:%M')"

          # 每半小时一次意味着每天 48 次提交，跟人手动推送撞车是常态。
          # 冲突时退避重试，别让一次 rebase 失败白跑一轮生成。
          for i in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main; then
              if git push; then
                echo "第 $i 次推送成功"
                exit 0
              fi
            else
              echo "第 $i 次 rebase 冲突，中止 rebase 后重来"
              git rebase --abort || true
            fi
            sleep $((i * 10))
          done
          echo "重试 4 次仍未推送成功，放弃（下一轮定时任务会继续）"
          exit 0
