name: SEO 内容流水线

# 触发方式：
#   1. 定时：每小时的第 7 分钟
#      刻意避开整点 —— 整点是全 GitHub 定时任务的拥堵时段，
#      排队会让任务实际执行时间明显滞后。
#   2. 手动：Actions 页面点 Run workflow，可选填参数
on:
  schedule:
    # GitHub 的 cron 用 UTC。hour 字段即每小时。
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '生成模式：promo=引流文章（默认）；topic=关键词主题页；post=基于真实帖子改写'
        required: false
        type: choice
        default: promo
        options:
          - promo
          - topic
          - post
      batch:
        description: '本次生成篇数（留空：promo 默认 1，其余默认 20）'
        required: false
        type: string
      angles:
        description: '每个关键词生成几个角度（1-7，仅 topic 模式）'
        required: false
        type: string
      full:
        description: '顺便补齐主题页积压（仅 topic 模式）'
        required: false
        type: boolean
        default: false
      force:
        description: '强制覆盖已发布内容（会改已收录页面，慎用）'
        required: false
        type: boolean
        default: false
      tag:
        description: '只处理指定分类，如：举牌（仅 post 模式有效）'
        required: false
        type: string
      dry_run:
        description: '只预览不写盘'
        required: false
        type: boolean
        default: false

# ===== 并发控制 =====
# 同一个分支同时只允许跑一个。cancel-in-progress: true 表示
# 新一轮会取消正在跑的那一轮 —— 定时任务偶尔会堆积，
# 宁可跑最新的，也不要排队跑三遍把额度耗光。
concurrency:
  group: seo-pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # 需要推送 commit

# 整条流水线 20 分钟超时。
# promo 模式（每小时 1 篇）通常 1-2 分钟跑完；
# topic 模式批量跑 20 篇约 5-10 分钟，留足余量。
# 卡死时 GitHub 会自动杀掉，避免每小时空耗配额。
timeout-minutes: 20

jobs:
  generate:
    name: 生成静态内容
    runs-on: ubuntu-latest
    outputs:
      new_pages: ${{ steps.summary.outputs.new_pages }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 关键：要带完整历史，否则增量提交时 git diff 拿不到基线，
          # 会出现"不知道哪些文件变了"导致全量提交。
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 本系统刻意零第三方依赖（只用标准库 urllib），
      # 所以不需要 pip install。冷启动 5 秒内完成。

      # ===== 密钥配置（重要）=====
      # 必须先在仓库里配置好，流水线才能用上 AI：
      #   Settings → Secrets and variables → Actions → New repository secret
      #   名称填：SEO_AI_API_KEY
      #   值填：你的智谱 API Key（253d1fb5... 这种格式）
      #
      # 没配也能跑：系统会自动降级为模板生成，产出结构合法但内容较浅的页面。
      #
      # BASE_URL / MODEL 走 Variables（不是 Secrets）——
      # 它们不是机密，只是可调参数，方便不改代码就换模型。
      - name: 生成内容
        id: gen
        env:
          SEO_AI_API_KEY: ${{ secrets.SEO_AI_API_KEY }}
          SEO_AI_BASE_URL: ${{ vars.SEO_AI_BASE_URL || 'https://open.bigmodel.cn/api/paas/v4' }}
          SEO_AI_MODEL: ${{ vars.SEO_AI_MODEL || 'glm-4.7-flash' }}
          # GLM-4.7-Flash 免费版只允许 1 条并发，客户端已内置节流
          SEO_AI_INTERVAL: '1.2'
          SEO_AI_THINKING: 'disabled'
          SEO_ANGLES_PER_KW: ${{ github.event.inputs.angles || '2' }}
          SEO_DEBUG: '1'
          # ===== 搜索引擎推送配置 =====
          # 不配也能跑，只是不会主动推送，靠 sitemap 被爬虫发现（慢 1-3 天）
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
          SEO_SUBMIT_ON: '1'
        run: |
          MODE="${{ github.event.inputs.mode || 'promo' }}"
          # batch 留空时，promo 走 1 篇/小时，其余模式走 20 篇
          if [ -n "${{ github.event.inputs.batch }}" ]; then
            BATCH="${{ github.event.inputs.batch }}"
          elif [ "$MODE" = "promo" ]; then
            BATCH="1"
          else
            BATCH="20"
          fi
          ARGS="--mode ${MODE} --batch ${BATCH}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ github.event.inputs.tag }}" != "" ]; then ARGS="$ARGS --tag ${{ github.event.inputs.tag }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          # 顺带补齐主题页积压（仅 topic 模式，手动触发时可用）
          if [ "${{ github.event.inputs.full }}" = "true" ] && [ "$MODE" = "topic" ]; then
            ARGS="$ARGS --batch 60"
          fi
          echo "运行参数：$ARGS"
          python -m seo.run $ARGS | tee seo-run.log

      - name: 校验产物
        id: summary
        run: |
          # 格式校验：确认 SEO 必需元素齐全。
          # 少任何一个 meta 都会让这一页的收录能力大打折扣，
          # 与其让这种页面上线，不如在这里就失败。
          #
          # 两个目录都要校验：主题页在 seo-pages/，引流文在 promo/
          python - <<'PY'
          import glob, sys, json, re, os
          pages = (glob.glob('seo-pages/post/*/index.html')
                   + glob.glob('promo/post/*/index.html')
                   + glob.glob('promo/index.html'))
          if not pages:
              print('没有生成任何页面'); sys.exit(1)
          need = ['<title>', 'name="description"', 'rel="canonical"',
                  'application/ld+json', 'og:title']
          # articleBody 只在正文页有；索引/列表页是CollectionPage，
          # 结构上就不该有正文，要求它存在会导致误判
          body_need = 'itemprop="articleBody"'
          is_list = p.endswith('promo/index.html')
          bad = []
          for p in pages:
              html = open(p, encoding='utf-8').read()
              miss = [n for n in need if n not in html]
              if not is_list and body_need not in html:
                  miss.append(body_need)
              if miss: bad.append((p, miss))
              # JSON-LD 必须是合法 JSON，否则结构化数据不生效
              m = re.search(r'application/ld\+json">(.*?)</script>', html, re.S)
              if m:
                  try: json.loads(m.group(1))
                  except Exception: bad.append((p, ['JSON-LD 非法']))
          print('页面总数：%d' % len(pages))
          if bad:
              print('校验失败 %d 个：' % len(bad))
              for p, m in bad[:5]: print('  %s 缺 %s' % (p, m))
              sys.exit(1)

          # 死链检查：内链指向的页面必须真实存在
          def exists(kind, slug):
              return any(os.path.exists(t % slug) for t in (
                  'seo-pages/post/%s/index.html',
                  'seo-pages/kw/%s/index.html',
                  'seo-pages/tag/%s/index.html',
                  'promo/post/%s/index.html'))

          dead = 0
          for p in pages:
              html = open(p, encoding='utf-8').read()
              for kind, slug in re.findall(
                      r'href="[^"]*/(post|kw|tag)/([^/"]+)/"', html):
                  if not exists(kind, slug):
                      dead += 1
                      if dead <= 5: print('  死链：%s → %s/%s' % (p, kind, slug))
          if dead:
              print('存在 %d 个死链' % dead); sys.exit(1)
          print('校验通过：SEO 元素齐全，JSON-LD 合法，无死链')
          with open('.pagecount', 'w') as f:
              f.write(str(len(pages)))
          PY

      - name: 提交变更
        id: commit
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name 'seo-bot'
          git config user.email 'seo-bot@users.noreply.github.com'
          # seo/state/ledger.json 必须一起提交：它是幂等判断的依据。
          # 不提交的话下一次运行会从空账本开始，把已发布页面全部重新覆盖。
          #
          # IndexNow 的密钥文件也要提交：爬虫靠它验证域名归属。
          # 这不是机密 —— 它的作用本来就是证明「这个域名是我的」，
          # 搜索引擎和其他站长都能看到。真正的机密是 API Key 本身。
          git add -A seo-pages promo robots.txt seo/state/ledger.json .count
          # 密钥文件名带 key 值，用通配带上
          if [ -n "${{ secrets.INDEXNOW_KEY }}" ]; then
            git add "${{ secrets.INDEXNOW_KEY }}.txt" || true
          fi
          # 没有变更时不提交。这很关键：
          # 空提交会白白触发一次 Pages 重新构建（75-165秒），
          # 而且会让 Actions 看起来一直在动。
          if git diff --cached --quiet; then
            echo "无内容变更，跳过提交"
            echo "new_pages=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CNT=$(git diff --cached --name-only | wc -l)
          git commit -m "seo: 自动更新 $CNT 个文件 [skip ci]"
          git push
          echo "new_pages=$CNT" >> "$GITHUB_OUTPUT"

      - name: 保存运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-run-log
          path: |
            seo/logs/
            seo-run.log
          retention-days: 14
